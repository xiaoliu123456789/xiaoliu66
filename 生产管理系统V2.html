<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生产管理系统 · 车间作业</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e6e8ec; --line2:#d6d9df;
  --tx:#1f2328; --tx2:#5b6370; --tx3:#8b93a1;
  --pri:#2f5fd0; --pri-bg:#eef3fd;
  --ok:#1a7f52; --ok-bg:#e8f5ee;
  --warn:#a86400; --warn-bg:#fdf3e3;
  --err:#c0392b; --err-bg:#fdeceb;
  --gray-bg:#f0f1f4;
  --r:8px; --r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- 顶栏 ---------- */
.top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:20;flex-wrap:nowrap;overflow-x:auto}
.top .logo{font-size:15px;font-weight:600;letter-spacing:.3px}
.top .logo span{color:var(--tx3);font-weight:400;font-size:12.5px;margin-left:8px}
.top .sp{flex:1}
.role{display:flex;gap:2px;background:var(--gray-bg);padding:3px;border-radius:var(--r)}
.role button{padding:5px 12px;border-radius:6px;font-size:12.5px;color:var(--tx2)}
.role button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.who{font-size:12.5px;color:var(--tx2)}

/* ---------- 布局 ---------- */
.wrap{display:flex;height:calc(100vh - 52px)}
.nav{width:92px;background:#fff;border-right:1px solid var(--line);padding:10px 6px;overflow-y:auto;flex:0 0 92px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:10px 4px;border-radius:var(--r);font-size:12px;color:var(--tx2);margin-bottom:2px}
.nav button .ic{font-size:17px;line-height:1}
.nav button.on{background:var(--pri-bg);color:var(--pri);font-weight:600}
.nav button .bdg{position:absolute;top:6px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.nav button{position:relative}

.list{width:300px;flex:0 0 300px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.list .lh{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.list .lh h3{font-size:14px;font-weight:600}
.list .lh p{font-size:12px;color:var(--tx3);margin-top:3px}
.list .lb{flex:1;overflow-y:auto}
.ls{display:flex;gap:8px;padding:11px 14px;border-bottom:1px solid #f1f2f5;cursor:pointer;align-items:flex-start}
.ls:hover{background:#fafbfc}
.ls.on{background:var(--pri-bg);box-shadow:inset 3px 0 0 var(--pri)}
.ls .m{flex:1;min-width:0}
.ls .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls .s{font-size:12px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls .r{font-size:11.5px;color:var(--tx3);text-align:right;white-space:nowrap;padding-top:1px;flex:0 0 auto;margin-left:6px}
.ls .r b{display:block;font-size:13px;color:var(--tx);font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--tx3);font-size:13px}
@media(max-width:900px){ .empty{padding:60px 20px} }

.panel{flex:1;min-width:0;overflow-y:auto;padding:18px 20px 40px}
.ph{margin-bottom:14px}
.ph .crumb{font-size:12px;color:var(--tx3)}
.ph h2{font-size:17px;font-weight:600;margin:3px 0 4px}
.ph p{font-size:12.5px;color:var(--tx2)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px}
.card h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h4 .sp{flex:1;font-weight:400;font-size:12px;color:var(--tx3)}
.sec-t{font-size:12.5px;font-weight:600;color:var(--tx2);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec-t .sp{flex:1;font-weight:400;color:var(--tx3);font-size:12px;text-align:right}

/* ---------- 条目行（替代表格） ---------- */
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #eef0f3;font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{width:88px;flex:0 0 88px;color:var(--tx3);font-size:12.5px}
.kv .v{flex:1;min-width:0}

/* ---------- 可勾选条目 ---------- */
.pick{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;background:#fff}
.pick:hover{border-color:var(--line2)}
.pick.on{border-color:var(--pri);background:var(--pri-bg)}
.pick.dis{opacity:.5;cursor:default}
.box{width:17px;height:17px;flex:0 0 17px;border:1.5px solid var(--line2);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.pick.on .box{background:var(--pri);border-color:var(--pri)}
.pick .m{flex:1;min-width:0}
.pick .t{font-size:13.5px;font-weight:500}
.pick .s{font-size:11.5px;color:var(--tx2);margin-top:2px}
.pick .r{font-size:11.5px;color:var(--tx3);text-align:right}

/* ---------- chip / badge ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;background:#fff;cursor:pointer}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.chip.dis{opacity:.45;cursor:default}
.chip.co{border-style:dashed;border-color:var(--tx3);color:var(--tx2)}
.chip .tg{font-style:normal;display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;background:var(--warn-bg);color:#8a5300;font-size:11px;font-weight:500;letter-spacing:.2px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;background:var(--gray-bg);color:var(--tx2);white-space:nowrap}
.badge.pri{background:var(--pri-bg);color:var(--pri)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}

/* ---------- 进度 ---------- */
.bar{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.ok{background:var(--ok)}
.bar i.do{background:#e0a300}
.stepbar{display:flex;gap:3px;margin-top:6px}
.stepbar i{flex:1;height:5px;border-radius:2px;background:var(--gray-bg)}
.stepbar i.done{background:var(--ok)}
.stepbar i.doing{background:#e0a300}
.ring{width:44px;height:44px;flex:0 0 44px}

/* ---------- 表单 / 按钮 ---------- */
.frm{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.fld{flex:1;min-width:130px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;font-size:13px}
.fld input:focus,.fld select:focus{outline:2px solid var(--pri-bg);border-color:var(--pri)}
.btn{padding:7px 14px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;font-size:13px}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.pri:hover{background:#2a55bd}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:500}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:500}
.btn.err{background:var(--err);border-color:var(--err);color:#fff;font-weight:500}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.bar-btm{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--gray-bg);border-radius:var(--r);margin-top:12px;flex-wrap:wrap}
.lnk{color:var(--pri);font-size:12.5px;cursor:pointer}
.lnk:hover{text-decoration:underline}
.note{padding:10px 12px;border-radius:var(--r);font-size:12.5px;line-height:1.7;background:var(--pri-bg);color:#24406e;margin-bottom:12px}
.note.ok{background:var(--ok-bg);color:#14603d}
.note.warn{background:var(--warn-bg);color:#8a5300}
.note.err{background:var(--err-bg);color:#96271a}

/* ---------- 统计 ---------- */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{flex:1;min-width:88px;background:var(--gray-bg);border-radius:var(--r);padding:9px 11px}
.stat .l{font-size:11.5px;color:var(--tx2)}
.stat .n{font-size:19px;font-weight:600;margin-top:2px}

/* ---------- 人员行 ---------- */
.prow{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px}
.prow.on{border-color:var(--pri);background:var(--pri-bg)}
.prow .av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.prow .m{flex:1;min-width:0}
.prow .t{font-size:13px;font-weight:500}
.prow .s{font-size:11.5px;color:var(--tx2)}
/* 排产甘特图 */
.gt{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.gt-row{display:flex;align-items:stretch;border-bottom:1px dashed #eef0f3}
.gt-row:last-child{border-bottom:none}
.gt-row.gt-scale{background:var(--gray-bg);border-bottom:1px solid var(--line)}
.gt-lab{width:136px;flex:0 0 136px;padding:6px 10px;border-right:1px solid var(--line);overflow:hidden}
.gt-lab .t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-lab .s{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-track{position:relative;flex:1;min-width:0;height:32px}
.gt-tick{position:absolute;top:5px;font-size:11px;color:var(--tx3)}
.gt-bar{position:absolute;top:6px;height:20px;border-radius:5px;background:var(--pri);color:#fff;font-size:11px;
  line-height:20px;padding:0 7px;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.gt-bar.sel{background:#1a7f52}
.gt-bar.draft{background:#e6eaf1;color:#5b6470;border:1px dashed #b9c2cf}
.gt-bar.other{background:#c3cad6;color:#41474f}
.gt-mark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #e0a020}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--pri);margin-right:4px}
.lg.sel{background:#1a7f52}.lg.draft{background:#e6eaf1;border:1px dashed #b9c2cf}.lg.other{background:#c3cad6}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#1f2328;color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast div.ok{background:var(--ok)}
#toast div.err{background:var(--err)}

.back{display:none}
@media(max-width:900px){
  .top{gap:8px;padding:0 10px}
  .top .logo{font-size:14px;white-space:nowrap}
  .top .logo span{display:none}
  .top .who{flex:0 0 auto}
  .top .who select{max-width:118px;padding:4px 6px;font-size:12px}
  .role{flex:0 0 auto}
  .role button{padding:5px 9px;font-size:12px;white-space:nowrap}
  .nav{width:100%;flex:none;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px}
  .nav button{flex:0 0 auto;width:auto;padding:8px 12px}
  .nav button .bdg{position:static;margin-left:4px}
  .wrap{flex-direction:column}
  .list{width:100%;flex:none;border-right:none;max-height:none}
  .ls{flex-wrap:wrap}
  .ls .m{flex:1 1 100%}
  .ls .r{width:100%;text-align:left;margin:5px 0 0;color:var(--tx2)}
  .ls .r b{display:inline;margin-right:4px}
  .panel{padding:14px}
  body.mobile-panel .list{display:none}
  body:not(.mobile-panel) .panel{display:none}
  .back{display:inline-block}
}

/* ============================================================
   改版样式：配色与布局对齐参考稿
   深藏青侧栏 #182845 · 亮蓝主色 #3999fe · 浅灰底 #f3f5f8
   ============================================================ */
:root{
  --pri:#3999fe; --pri-d:#2b86e8; --pri-bg:#eff6ff;
  --bg:#f3f5f8; --line:#eef0f4; --line2:#e3e6eb;
  --tx:#1f2430; --tx2:#5b6270; --tx3:#98a0ae;
  --ok:#22b573; --ok-bg:#e9f8f0;
  --warn:#fea426; --warn-bg:#fef4e7;
  --err:#fe6c75; --err-bg:#feeaeb;
  --gray-bg:#f5f7fa;
  --nav:#182845; --nav-tx:#c2cadd;
  --r:6px; --r2:10px;
}
body{background:var(--bg)}

/* ---------- 外壳 ---------- */
.wrap{display:flex;height:100vh;overflow:hidden}
.nav{width:220px;flex:0 0 220px;background:var(--nav);border-right:none;padding:0;overflow:hidden;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.bmark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:linear-gradient(135deg,#ffa63d,#f0670a);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(240,103,10,.35)}
.bmark svg{width:19px;height:19px}
.btxt{font-size:15px;font-weight:600;color:#fff;line-height:1.25;letter-spacing:.2px}
.btxt em{display:block;font-style:normal;font-size:11px;font-weight:400;color:rgba(255,255,255,.45);margin-top:3px}
.navlist{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav button{display:flex;flex-direction:row;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:8px;font-size:13.5px;color:var(--nav-tx);margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--pri);color:#fff;font-weight:500;box-shadow:0 6px 16px rgba(57,153,254,.3)}
.nav button .ic{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:0;flex:0 0 18px}
.nav button .ic svg{width:18px;height:18px}
.nav button .bdg{position:static;margin-left:auto;background:var(--err);color:#fff;font-size:10.5px;min-width:17px;height:17px;line-height:17px;border-radius:9px;padding:0 5px}
.nav button.on .bdg{background:rgba(255,255,255,.3)}
.navfoot{padding:12px 20px 16px;font-size:11.5px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:7px}
.dot-g{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;position:relative;overflow:visible}
.navtoggle{width:30px;height:30px;flex:0 0 30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#4b5563;transition:.15s}
.navtoggle:hover{background:#f2f5fa;color:var(--pri)}
.navtoggle svg{width:19px;height:19px}
.crumb{display:flex;align-items:center;min-width:0;white-space:nowrap;margin-left:2px}
.crumb .cc{font-size:15px;font-weight:400;color:#8c8c8c;overflow:hidden;text-overflow:ellipsis}
.nav{transition:width .2s,flex-basis .2s}
/* 侧栏收起为图标模式（仅桌面） */
@media(min-width:901px){
  body.navc .nav{width:64px;flex:0 0 64px}
  body.navc .brand{justify-content:center;padding:18px 0 14px}
  body.navc .btxt,body.navc .navfoot{display:none}
  body.navc .navlist{padding:6px 8px 12px}
  body.navc .nav button{justify-content:center;padding:11px 0;gap:0}
  body.navc .nav button .nm{display:none}
  body.navc .nav button .bdg{position:absolute;top:7px;right:13px;min-width:6px;width:6px;height:6px;padding:0;border-radius:50%;font-size:0;line-height:0;overflow:hidden;background:var(--err)}
  body.navc .navtoggle svg{transform:rotate(180deg)}
  body.navc .nav button .ic{width:20px;height:20px;flex:0 0 20px}
  body.navc .nav button .ic svg{width:20px;height:20px}
}
.vline{width:1px;height:18px;background:var(--line2)}
.ibtn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);padding:6px 8px;border-radius:6px;position:relative}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{background:var(--gray-bg);color:var(--pri)}
.ibtn .icw{position:relative;display:flex;align-items:center}
.ibtn .dot{position:absolute;top:-6px;right:-3px;min-width:15px;height:15px;line-height:15px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;text-align:center;font-style:normal;padding:0 3px;box-shadow:0 0 0 2px #fff}
.role{background:var(--gray-bg);padding:3px;border-radius:8px;display:flex;gap:2px;flex:0 0 auto}
.role button{padding:5px 12px;border-radius:6px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.role button.on{background:#fff;color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(24,40,69,.12)}
.who{font-size:12.5px;color:var(--tx2);white-space:nowrap}
.who select{border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:12.5px;background:#fff;color:var(--tx)}
.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.body{flex:1;display:flex;min-height:0;overflow:hidden}
.list{width:300px;flex:0 0 300px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.panel{flex:1;min-width:0;overflow-y:auto;padding:18px 22px 32px}
body.wide .list{display:none}
body.wide .back{display:none!important}

/* ---------- 组件 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(24,40,69,.03)}
.card h4{font-size:14px;margin-bottom:12px}
.ph .crumb{font-size:12px;color:var(--tx3)}
.ph h2{font-size:18px;margin:4px 0 5px}
.ph p{font-size:12.5px}
.btn{border:1px solid var(--line2);border-radius:var(--r);padding:7px 14px;background:#fff;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#1c9e63;border-color:#1c9e63;color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.warn:hover{background:#f39310;border-color:#f39310;color:#fff}
.btn.err{background:var(--err);border-color:var(--err);color:#fff}
.btn.err:hover{background:#f25663;border-color:#f25663;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--tx);background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(57,153,254,.14)}
.badge{border-radius:5px;padding:2px 9px;font-size:12px;background:#f2f4f7;color:#6b7280}
.badge.pri{background:#ebf4fe;color:#2f8bfe}
.badge.ok{background:var(--ok-bg);color:#1d9d63}
.badge.warn{background:var(--warn-bg);color:#e08a1e}
.badge.err{background:var(--err-bg);color:#ef5b66}
.ls{padding:12px 16px;border-bottom:1px solid #f4f6f9}
.ls:hover{background:#f8fbff}

function devState(d){
  if(d.inbound) return { t:'已入库', c:'ok' };
  if(d.steps.every(s=>s.st==='done')) return { t:'已完工', c:'ok' };
  if(!d.planStart) return { t:'待排产', c:'' };
  if(d.steps.some(s=>!s.g)) return { t:'待派单', c:'pri' };
  if(d.steps.some(s=>s.g&&!s.e)) return { t:'待派工', c:'warn' };
  if(d.steps.some(s=>s.st==='doing'||s.st==='done')) return { t:'在制', c:'pri' };
  return { t:'待开工', c:'' };
}
function devPct(d){
  const n=d.steps.length; if(!n) return 0;
  return Math.round(d.steps.filter(s=>s.st==='done').length/n*100);
}
function devCurStep(d){
  // 当前工序 = 已派工且未完工的第一道；都没派工时退回第一道未完工工序（只用于展示）
  return d.steps.find(s=>s.e&&s.st!=='done') || d.steps.find(s=>s.st!=='done') || null;
}
function projStats(p){
  const ds=devOf(p.id), n=ds.length;
  return {
    n,
    planned: ds.filter(d=>d.planStart).length,
    assigned: ds.filter(d=>d.steps.every(s=>s.g)).length,
    worked: ds.filter(d=>d.steps.every(s=>s.e)).length,
    done: ds.filter(d=>d.steps.every(s=>s.st==='done')).length,
    inbound: ds.filter(d=>d.inbound).length,
    pct: n? Math.round(ds.reduce((a,d)=>a+devPct(d),0)/n) : 0,
  };
}
function projStateLabel(p){
  const s=projStats(p);
  if(p.st==='pending_review') return { t:'待审核', c:'err' };
  if(p.st==='rejected') return { t:'已退回', c:'err' };
  if(s.inbound===s.n && s.n) return { t:'已入库', c:'ok' };
  if(s.done===s.n && s.n) return { t:'待检验', c:'ok' };
  if(s.worked===s.n && s.n) return { t:'生产中', c:'pri' };
  if(s.assigned===s.n && s.n) return { t:'待派工', c:'warn' };
  if(s.planned===s.n && s.n) return { t:'待派单', c:'pri' };
  if(s.planned>0) return { t:'部分排产', c:'pri' };

}

/* 产能窗口：某段日期内每天在排产的设备台数（立项审核的产能评估用） */
function windowLoad(start,end){
  const rows=[]; let d=start, guard=0;
  while(d<=end && guard++<400){
    const devs=DEV.filter(x=>x.planStart && d>=x.planStart && d<=x.planEnd);
    rows.push({ d, n:devs.length, projs:[...new Set(devs.map(x=>x.proj))] });
    d=addD(d,1);
  }
  const peak=rows.reduce((a,r)=>Math.max(a,r.n),0);
  return { rows, peak, avg:Math.round(rows.reduce((a,r)=>a+r.n,0)/(rows.length||1)) };
}
/* 按自然周汇总 */
function weekLoad(start,end){
  const out=[]; let d=start, guard=0;
  while(d<=end && guard++<120){
    const sun=addD(d,6), e2=sun>end?end:sun;
    const ld=windowLoad(d,e2);
    out.push({ from:d, to:e2, peak:ld.peak, avg:ld.avg, projs:[...new Set(ld.rows.flatMap(r=>r.projs))] });
    d=addD(sun,1);
  }
  return out;
}
function loadBar(v,max,tone){
  const pct=max?Math.max(3,Math.round(v/max*100)):0;
  return `<div class="bar" style="width:150px;display:inline-block;vertical-align:middle"><i class="${tone||''}" style="width:${pct}%"></i></div>`;
}

function dEnc(d){ const a=String(d).split('-').map(Number); return Date.UTC(a[0],a[1]-1,a[2]); }
function daysBetween(a,b){ if(!a||!b) return 0; return Math.round((dEnc(b)-dEnc(a))/86400000); }
function isWorkday(d){ const a=String(d).split('-').map(Number); const w=new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay(); return w>=1&&w<=5; }
function workdaysBetween(from,to){ let n=0; const total=daysBetween(from,to)+1;
  for(let i=0;i<total&&i<400;i++){ if(isWorkday(addD(from,i))) n++; } return n; }
/* 甘特图：rows=[{label,sub,start,end,tag,cls}] */
function ganttHtml(from,to,rows){
  if(!from||!to) return '<div class="empty">请先填写计划日期</div>';
  if(daysBetween(from,to)<0){ const t=from; from=to; to=t; }
  const total=Math.max(1,daysBetween(from,to)+1), dayPct=100/total;
  const ticks=[]; for(let i=0;i<total&&i<400;i+=7) ticks.push({ d:addD(from,i), left:i*dayPct });
  const grid=`background-image:linear-gradient(to right,#eef0f3 1px,transparent 1px);background-size:${dayPct.toFixed(3)}% 100%`;
  const tm=(TODAY>=from&&TODAY<=to)? (daysBetween(from,TODAY)*dayPct).toFixed(2) : null;
  return `<div class="gt">
    <div class="gt-row gt-scale">
      <div class="gt-lab">日期</div>
      <div class="gt-track" style="height:24px">${ticks.map(t=>`<span class="gt-tick" style="left:${t.left.toFixed(2)}%">${t.d.slice(5)}</span>`).join('')}</div>
    </div>
    ${rows.map(r=>{
      const o=Math.max(0,Math.min(total-1,daysBetween(from,r.start)));
      const len=Math.max(1,Math.min(total-o,daysBetween(r.start,r.end)+1));
      return `<div class="gt-row">
        <div class="gt-lab"><div class="t" title="${esc(r.label)}">${esc(r.label)}</div><div class="s">${r.sub||''}</div></div>
        <div class="gt-track" style="${grid}">
          ${tm!==null?`<div class="gt-mark" style="left:${tm}%"></div>`:''}
          <div class="gt-bar ${r.cls||''}" style="left:${(o*dayPct).toFixed(2)}%;width:${(len*dayPct).toFixed(2)}%">${esc(r.tag||'')}</div>
        </div></div>`;
    }).join('')}
  </div>`;
}
/* 一段窗口内、排产时间与窗口有交集的设备（可排除某项目） */
function devsInWindow(from,to,excludePid){
  return DEV.filter(d=> d.planStart&&d.planEnd && d.planStart<=to && d.planEnd>=from
    && (!excludePid||d.proj!==excludePid));
}
/* 逐天负荷 */
function dayLoadRows(from,to,excludePid){
  if(daysBetween(from,to)<0) return { rows:[], peak:0, avg:0 };
  const devs=devsInWindow(from,to,excludePid), total=Math.max(1,daysBetween(from,to)+1), rows=[];
  for(let i=0;i<total&&i<400;i++){
    const d=addD(from,i), hit=devs.filter(x=>x.planStart<=d&&x.planEnd>=d);
    rows.push({ d, n:hit.length, projs:[...new Set(hit.map(x=>x.proj))] });
  }
  const sum=rows.reduce((a,r)=>a+r.n,0);
  return { rows, peak:rows.reduce((a,r)=>Math.max(a,r.n),0), avg:Math.round(sum/(rows.length||1)) };
}
/* 班组在某窗口内的工作量：按设备的排产窗口 ∩ 工序归属估算（派单后以工序计划为准） */
function groupWorkload(gid, from, to, excludePid){
  let cells=0; const sns=[], projs=[];
  DEV.forEach(d=>{
    if(!d.planStart||!d.planEnd) return;
    if(d.planStart>to||d.planEnd<from) return;
    if(excludePid&&d.proj===excludePid) return;
    d.steps.forEach(st=>{ const owner=st.g||procGroups(st.p)[0];
      if(owner===gid){ cells++; if(sns.indexOf(d.sn)<0) sns.push(d.sn); if(projs.indexOf(d.proj)<0) projs.push(d.proj); } });
  });
  return { gid, cells, devs:sns, projs };
}

/* 可勾选的设备条目 */
/* 谁能做这道工序：以「工序管理」里维护的 PROC[pid].groups 为准（可多选 → 支持一组多工序/跨组支援） */
function procGroups(pid){
  const p=PROC[pid]; if(!p) return [];
  if(p.groups&&p.groups.length) return p.groups.slice();
  return p.group? [p.group] : [];                  // 兼容历史单值写法
}
function groupCanDo(gid,pid){ return procGroups(pid).includes(gid); }
/* 工序被哪些工艺路线使用 */
function procUsedIn(pid){
  return CRAFT_LIST.filter(cid=>{ const c=CRAFT[cid]||{};
    return (c.procs||[]).includes(pid)||(c.ind||[]).includes(pid); });
}
/* 工艺路线涉及到的所有班组 = 排产时默认的「参与班组」 */
function craftGroups(craftId){
  const cf=CRAFT[craftId]||{};
  const pids=[].concat(cf.procs||[], cf.ind||[]);
  const gs=pids.flatMap(pid=>procGroups(pid));
  return [...new Set(gs)].length? [...new Set(gs)] : [GROUPS[0].id];
}
/* 一批设备的参与班组（可多个）：设备已设过就用它，否则按工艺路线全部带出 */
function devListOf(sel){ return (sel||[]).map(x=>typeof x==='string'? dev(x) : x).filter(Boolean); }
function leadGroupsOf(sel, craftId){
  const hit=devListOf(sel).find(d=>(d.gids||[]).length);
  return hit? hit.gids.slice() : craftGroups(craftId);
}
/* 派单时某道工序的可选班组 = 参与班组 ∩ 会做这道工序的组；交集为空则退回「全部会做的组」并标记冲突 */
function candGroups(pid, sel, craftId){
  const parts=leadGroupsOf(sel, craftId);
  const can=GROUPS.filter(g=>groupCanDo(g.id,pid)).map(g=>g.id);
  const hit=can.filter(g=>parts.includes(g));
  return { list:hit.length?hit:can, narrowed:hit.length>0, parts, can, conflict:!hit.length };
}

function projLevelTag(l){ return `<span class="badge ${l==='紧急'?'err':''}">${esc(l)}</span>`; }
function projTag(st){
  const c = st==='已退回' ? 'err' : st==='待审核' ? 'warn' : st==='待派工' ? 'warn'
    : (st==='待检验'||st==='已入库') ? 'ok' : (st==='待派单'||st==='生产中'||st==='部分排产') ? 'pri' : '';
  return `<span class="badge ${c}">${esc(st)}</span>`;

function kpiHit(p,k){
  if(!k||k==='all') return true;
  if(k==='待审核') return p.st==='pending_review';
  if(k==='执行中') return ['scheduled','assigned','producing'].includes(p.st);
  if(k==='已退回') return p.st==='rejected';
  if(k==='已完成'){ const s=projStats(p); return s.n>0 && s.inbound===s.n; }
  return true;
}

    if(f.type!=='all' && p.type!==f.type) return false;

    if(f.kw && p.name.indexOf(f.kw)<0) return false;
    if(f.no && p.id.indexOf(f.no)<0) return false;

/* ---------- 项目立项审核 ---------- */
function viewProjAudit(){
  const list=LIXIANG.map(x=>litem(`pick('${x.id}')`,esc(x.name),
    `${x.id} · ${esc(x.product)} ×${x.qty} 台 · 希望 ${x.wantEnd} 前交付`,
    badge(x.st==='pending'?'待审核':x.st==='passed'?'已通过':'已驳回',x.st==='pending'?'err':x.st==='passed'?'ok':''),
    S.cur===x.id?'on':'')).join('')||'<div class="empty">没有立项申请</div>';
  const r=LIXIANG.find(x=>x.id===S.cur);
  if(!r) return { lh:['项目立项审核',`待审 ${counts().pendProj} 个`], list,
    panel:'<div class="empty">选择左侧立项申请，核产能后决定接不接</div>' };
  const wStart=addD(r.wantStart,-14), wEnd=addD(r.wantEnd,14);
  const weeks=weekLoad(wStart,wEnd);
  const peak=Math.max(...weeks.map(w=>w.peak),0);
  const busiest=weeks.slice().sort((a,b)=>b.peak-a.peak)[0]||{};
  const busy=peak>=24;
  const projs=[...new Set(weeks.flatMap(w=>w.projs))];
  const maxP=Math.max(peak,1);
  const done=r.st!=='pending';
  const body=`<div class="ph"><div class="crumb">项目立项审核 · ${r.id}</div><h2>${esc(r.name)}</h2>
    <p>${esc(r.cus)} · ${esc(r.product)} ×${r.qty} 台 · ${esc(r.sales)}</p></div>
  ${hbar([['申请台数',r.qty+' 台'],['希望开工',r.wantStart],['希望交付',r.wantEnd],
    ['窗口峰值',peak+' 台'],['产能结论',busy?'紧张':'可承接']])}
  <div class="card"><h4>申请信息</h4>
    ${kv('项目名称',esc(r.name))}${kv('客户',esc(r.cus))}
    ${kv('产品 / 台数',esc(r.product)+' ×'+r.qty+' 台')}
    ${kv('希望时间','<b>'+r.wantStart+' ~ '+r.wantEnd+'</b>')}
    ${kv('提交人',esc(r.sales)+' · '+r.at)}
    ${kv('客户诉求',esc(r.note)||'—')}
  </div>
  <div class="card"><h4>产能评估 <span class="sp">该项目时间窗前后各两周的排产占用（每周取峰值）</span></h4>
    <div class="frm" style="margin-bottom:6px">
      <div class="fld"><label>评估窗口</label><input value="${wStart} ~ ${wEnd}" readonly></div>
      <div class="fld"><label>窗口内其他项目</label><input value="${projs.length} 个${projs.length?'（'+projs.map(id=>proj(id)?proj(id).name:id).join('、')+'）':''}" readonly></div>
    </div>
    ${weeks.map(w=>`<div class="kv"><div class="k">${w.from.slice(5)} ~ ${w.to.slice(5)}</div>
      <div class="v">${loadBar(w.peak,maxP,w.peak>=24?'do':'')} ${w.peak} 台在排产
      <span style="color:var(--tx3);font-size:11.5px"> · 日均 ${w.avg} 台${w.projs.length?' · '+w.projs.map(id=>proj(id)?proj(id).name:'—').join('、'):''}</span></div></div>`).join('')}
    <div class="note ${busy?'warn':'ok'}" style="margin-top:10px">${busy
      ? `产能偏紧：${busiest.from} ~ ${busiest.to} 这一周车间已有 <b>${peak}</b> 台柜子在排产，再接 ${r.qty} 台会挤在一起。建议与销售重议交期，或让客户接受分批交货。`
      : `产能可承接：窗口内车间峰值 ${peak} 台在排产，接这 ${r.qty} 台不会与现有计划冲突。`}</div>
  </div>
  <div class="card"><h4>审核结论</h4>
    ${done?kv('审核结果',(r.st==='passed'?badge('通过立项','ok'):badge('驳回','err'))+(r.pid?' · 已生成生产项目 '+r.pid:'')+(r.reason?' · 原因：'+esc(r.reason):''))
      :`<div class="fld"><label>审核意见（驳回时必填）</label><input id="paNote" placeholder="例如：产能不足，建议交期后延一周"></div>`}
  </div>
  ${done?`<div class="note ${r.st==='passed'?'ok':'err'}">该立项申请已处理${r.st==='passed'?'，项目已进入正式项目列表（等任务书审核 → 排产）':'，已退回销售部'}。</div>`
   :`<div class="bar-btm">
      <span style="font-size:12.5px;color:var(--tx2)">通过后会生成正式项目与 ${r.qty} 台设备，并进入「任务书审核 → 排产」流程</span>
      <span style="display:flex;gap:8px">
        <button class="btn err" onclick="doProjAudit('${r.id}',0)">驳回</button>
        <button class="btn ok" onclick="doProjAudit('${r.id}',1)">通过立项</button>
      </span></div>`}`;
  return { lh:['项目立项审核',`待审 ${counts().pendProj} 个`], list, panel:body };
}

/* ---------- 工序库（主数据） ---------- */
const PRF={kw:'',grp:'all',st:'all',page:1,size:10};
let DWG=null;                                   // 工序编辑缓冲区（抽屉内）

function procRows(){
  const kw=PRF.kw.toLowerCase();
  return PROC_LIST.map(id=>PROC[id]).filter(p=>!!p).filter(p=>{
    if(kw && !(p.name.toLowerCase().includes(kw)||p.id.toLowerCase().includes(kw))) return false;
    if(PRF.grp!=='all' && !procGroups(p.id).includes(PRF.grp)) return false;
    if(PRF.st==='on' && p.off) return false;
    if(PRF.st==='off' && !p.off) return false;
    return true;
  });
}
function prfFind(){
  PRF.kw=(val('pfKw')||'').trim(); PRF.grp=val('pfGrp')||'all'; PRF.st=val('pfSt')||'all';
  PRF.page=1; render();
}
function prfReset(){ PRF.kw=''; PRF.grp='all'; PRF.st='all'; PRF.page=1; render(); }
function prfPage(n){ PRF.page=n; render(); }

function viewProc(){
  const rows=procRows();
  const pages=Math.max(1,Math.ceil(rows.length/PRF.size));
  PRF.page=Math.min(Math.max(1,PRF.page),pages);
  const view=rows.slice((PRF.page-1)*PRF.size, PRF.page*PRF.size);
  const onN=PROC_LIST.filter(id=>PROC[id]&&!PROC[id].off).length;

      ${GROUPS.map(g=>`<option value="${g.id}" ${PRF.grp===g.id?'selected':''}>${g.name}</option>`).join('')}</select>${caret}</label>
    <label class="fin"><span>状态</span><select id="pfSt">

    <button class="btn pri" onclick="prfFind()">查询</button>
    <button class="btn" onclick="prfReset()">重置</button>
  </div>`;
  const trs=view.length?view.map(p=>{
    const gs=procGroups(p.id);
    const used=procUsedIn(p.id);

      <td><span class="lk" onclick="dwProcView('${p.id}')">${esc(p.name)}</span></td>
      <td>${p.ind?'<span class="tag ind">前置独立</span>':'<span class="tag main">主链工序</span>'}</td>
      <td class="num">${p.days||1} 天</td>

      <td class="num">${money(p.price||0)}</td>
      <td>${used.length?`${used.length} 条`:'<span class="muted">未引用</span>'}</td>
      <td>${p.off?badge('已停用',''):badge('启用中','ok')}</td>
      <td><button class="bt b" onclick="dwProcView('${p.id}')">查看</button><button class="bt o" onclick="dwProcEdit('${p.id}')">编辑</button></td>
    </tr>`;
  }).join(''):`<tr><td colspan="9"><div class="empty">没有符合条件的工序</div></td></tr>`;
  const nums=[]; for(let i=1;i<=pages;i++) nums.push(`<button class="pg ${i===PRF.page?'on':''}" onclick="prfPage(${i})">${i}</button>`);
  const pager=`<div class="pager">

    <select onchange="PRF.size=+this.value;PRF.page=1;render()">${[10,20,50].map(n=>`<option value="${n}" ${PRF.size===n?'selected':''}>${n}</option>`).join('')}</select>

    ${nums.join('')}

  const headNotes=`共 ${PROC_LIST.length} 道 · 启用 ${onN} · 停用 ${PROC_LIST.length-onN} · 主链 ${mainN} / 前置 ${indN}`;

        <tbody>${trs}</tbody>
      </table></div>
      ${pager}
    </div>` };
}

const CRF={kw:'',model:'all',st:'all',page:1,size:10};
let DWC=null;                                   // 工艺编辑缓冲区（抽屉内）

function craftSeq(c){ return [].concat(c.ind||[], c.procs||[]); }
function craftCyc(c){ return craftSeq(c).reduce((a,pid)=>a+((PROC[pid]&&PROC[pid].days)||1),0); }
function craftCost(c){ return craftSeq(c).reduce((a,pid)=>a+((PROC[pid]&&PROC[pid].price)||0),0); }
function craftUsedBy(cid){ return PROJ.filter(p=>p.craft===cid); }
function craftModels(){ return [...new Set(CRAFT_LIST.map(id=>CRAFT[id]).filter(c=>c&&c.model).map(c=>c.model))]; }

function craftRows(){
  const kw=CRF.kw.toLowerCase();
  return CRAFT_LIST.map(id=>CRAFT[id]).filter(c=>!!c).filter(c=>{
    if(kw && !((c.name||'').toLowerCase().includes(kw)||c.id.toLowerCase().includes(kw))) return false;
    if(CRF.model!=='all' && (c.model||'')!==CRF.model) return false;
    if(CRF.st==='on' && c.off) return false;
    if(CRF.st==='off' && !c.off) return false;
    return true;
  });
}
function crfFind(){

}
function crfReset(){ CRF.kw=''; CRF.model='all'; CRF.st='all'; CRF.page=1; render(); }
function crfPage(n){ CRF.page=n; render(); }

function viewCraft(){
  const rows=craftRows();
  const pages=Math.max(1,Math.ceil(rows.length/CRF.size));

/* ---------- 生产排产 ---------- */
const PLF={kw:'',prog:'all',due:'all',page:1,size:10};
let PLN=null;                                   // 排产抽屉缓冲

function planRows(){
  const kw=PLF.kw.toLowerCase();
  return PROJ.filter(p=>['reviewed','scheduled','assigned','producing'].includes(p.st)).filter(p=>{
    if(kw && !(p.name.toLowerCase().includes(kw)||p.id.toLowerCase().includes(kw)||(p.cus||'').toLowerCase().includes(kw))) return false;
    const s=projStats(p);
    if(PLF.prog==='none' && s.planned>0) return false;
    if(PLF.prog==='part' && !(s.planned>0 && s.planned<s.n)) return false;
    if(PLF.prog==='done' && !(s.n && s.planned===s.n)) return false;
    if(PLF.due!=='all'){
      const d=daysBetween(TODAY,p.due);
      if(PLF.due==='late' && !(p.due<TODAY)) return false;
      if(PLF.due==='7' && !(d>=0&&d<=7)) return false;
      if(PLF.due==='30' && !(d>=0&&d<=30)) return false;
    }
    return true;
  }).sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
}
function plfFind(){
  PLF.kw=(val('plKw')||'').trim(); PLF.prog=val('plProg')||'all'; PLF.due=val('plDue')||'all';
  PLF.page=1; render();
}
function plfReset(){ PLF.kw=''; PLF.prog='all'; PLF.due='all'; PLF.page=1; render(); }
function plfPage(n){ PLF.page=n; render(); }

function viewPlan(){
  const rows=planRows();

  const pendN=all.reduce((a,p)=>{ const s=projStats(p); return a+(s.n-s.planned); },0);
  const lateN=all.filter(p=>p.due<TODAY && projStats(p).inbound<projStats(p).n).length;
  const caret=SVG('<path d="M6 9l6 6 6-6"/>');
  const filters=`
  <div class="frow3">

  </div>
  <div class="pfbar">
    <button class="btn pri" onclick="plfFind()">查询</button>

    </tr>`;

  const nums=[]; for(let i=1;i<=pages;i++) nums.push(`<button class="pg ${i===PLF.page?'on':''}" onclick="plfPage(${i})">${i}</button>`);
  const pager=`<div class="pager">
    <span>共 ${rows.length} 条，每页</span>

  </div>`;
  const headNotes=`共 ${all.length} 个项目 · 待排 ${pendN} 台 · 逾期 ${lateN} 个`;
  return { lh:['排产','按合同交期排序 · 选中项目后填时间窗与参与班组'], list:'', panel:`
    <div class="pcard">

      ${filters}
      <div class="tbl-wrap"><table class="ptbl">
        <thead><tr><th>项目编号</th><th>项目名称</th><th>客户</th><th>设备数</th><th>待排台数</th><th>合同交期</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>${trs}</tbody>
      </table></div>
      ${pager}
    </div>` };
}

/* 计件明细：按 班组 × 项目 × 工序 汇总已完工台数 */
function payRows(){
  const out={};
  DEV.forEach(d=>d.steps.forEach(s=>{ if(s.st!=='done'||!s.g) return;
    const k=s.g+'|'+d.proj+'|'+s.p;
    out[k]=out[k]||{ g:s.g, proj:proj(d.proj).name, p:s.p, qty:0, coef:1.0 };

  return Object.values(out).map(r=>({ ...r, amt:r.qty*PROC[r.p].price*r.coef }));
}

function startWiz(pid){

/* ---------- 设备物料单（一台设备按它要走的工序汇总出来的物料清单） ---------- */
function devMatOf(d){
  const out={};
  d.steps.forEach(s=>{
    (MAT[s.p]||[]).forEach(m=>{
      if(!out[m.c]) out[m.c]={ c:m.c, n:m.n, sp:m.sp, u:m.u, per:0, wh:m.wh, aux:!!m.aux, procs:[] };
      out[m.c].per+=m.per;
      if(!out[m.c].procs.includes(s.p)) out[m.c].procs.push(s.p);
    });
  });
  return Object.values(out);
}
/* 一批设备的物料单（同一物料跨工序合并） */
function batchMatList(devs){
  const out={};
  (devs||[]).forEach(sn=>devMatOf(dev(sn)).forEach(m=>{
    if(!out[m.c]) out[m.c]={ c:m.c, n:m.n, sp:m.sp, u:m.u, per:m.per, wh:m.wh, aux:!!m.aux, procs:[] };
    m.procs.forEach(p=>{ if(!out[m.c].procs.includes(p)) out[m.c].procs.push(p); });
  }));
  return Object.values(out).sort((a,b)=>(a.aux?1:0)-(b.aux?1:0));
}

function trAll(f){

/* 执行转交：设备 → 人 → 物料（领料单）一次到位，并写调配记录 */
function doTransfer(){
  const t=S.tr, x=DISPATCH.find(y=>y.id===t.dispId);
  if(!x){ toast('派工单已失效','err'); return; }
  if(!t.from||!t.to){ toast('请选择转出和转入人员','err'); return; }
  if(!t.devs.length){ toast('请勾选要转交的设备','err'); return; }
  if(!t.reason.trim()){ toast('请填写转交原因','err'); return; }
  const fromW=x.workers.find(w=>w.emp===t.from), toW=x.workers.find(w=>w.emp===t.to);
  const list=(MAT[x.proc]||[]).filter(m=>!m.aux);
  const mats=list.map(m=>({ c:m.c, n:m.n, u:m.u, q:Math.ceil(m.per*t.devs.length), wh:m.wh }));
  // 转出人：设备移出 + 领料单减项
  fromW.devs=fromW.devs.filter(sn=>!t.devs.includes(sn));
  fromW.lead=(fromW.lead||[]).filter(sn=>!t.devs.includes(sn));
  const fs=PICK.find(p=>p.dispId===x.id&&p.emp===t.from);
  if(fs){ mats.forEach(m=>{ const it=fs.items.find(z=>z.c===m.c); if(it) it.q=Math.max(0,it.q-m.q); });
          fs.items=fs.items.filter(z=>z.q>0); }
  // 转入人：设备并入 + 领料单加项
  if(!toW){ x.workers.push({ emp:t.to, devs:t.devs.slice(), lead:t.devs.slice(), mats:mats.map(m=>({c:m.c,q:m.q})) }); }
  else {
    t.devs.forEach(sn=>{ if(!toW.devs.includes(sn)) toW.devs.push(sn);
      toW.lead=toW.lead||[]; if(!toW.lead.includes(sn)) toW.lead.push(sn); });
    toW.mats=toW.mats||[];
    mats.forEach(m=>{ const z=toW.mats.find(y=>y.c===m.c); if(z) z.q+=m.q; else toW.mats.push({c:m.c,q:m.q}); });
  }
  let ts=PICK.find(p=>p.dispId===x.id&&p.emp===t.to);
  if(!ts){ ts={ no:nextNo('LL'), dispId:x.id, emp:t.to, st:'待领',
    items:mats.map(m=>({ c:m.c, n:m.n, q:m.q, wh:m.wh })) }; PICK.push(ts); }
  else { mats.forEach(m=>{ const z=ts.items.find(y=>y.c===m.c);
    if(z) z.q+=m.q; else ts.items.push({ c:m.c, n:m.n, q:m.q, wh:m.wh }); }); }
  // 设备工序负责人（主责顺延给接收人，转出人从协作名单里移除）
  t.devs.forEach(sn=>{ const st=dev(sn).steps.find(z=>z.p===x.proc); if(!st) return;
    if(st.e===t.from) st.e=t.to;
    st.es=(st.es||[]).filter(z=>z!==t.from);
    if(!st.es.includes(t.to)) st.es.push(t.to); });
  // 留档
  TRANSFER.push({ id:nextNo('DB'), at:TODAY+' 09:20', dispId:x.id, proj:x.proj, proc:x.proc,
    from:t.from, to:t.to, devs:t.devs.slice(), mats, reason:t.reason,
    by:S.role==='leader'? emp(GROUPS.filter(g=>g.id===G())[0].leader).name : '张建军' });
  x.workers=x.workers.filter(w=>w.devs.length);
  toast(`${emp(t.from).name} 的 ${t.devs.length} 台设备 + ${mats.reduce((a,m)=>a+m.q,0)} 件物料已转交 ${emp(t.to).name}，记录已留存`,'ok');
  S.sub=null; S.tr=null; render();
}

function setProcGroup(pid,g){ S.procGroup=S.procGroup||{}; S.procGroup[pid]=g; }
/* 某道工序在某批设备上的计划起止：已定过的优先，否则默认取设备排产窗口 */
function asgRowDate(o,pid,sel){
  const r=(S.pdc&&S.pdc[pid])||{};
  // 已经定过的工序计划优先
  const hit=devListOf(sel).find(d=>{ const st=d.steps.find(x=>x.p===pid); return st&&st.ps; });
  if(hit){ const st=hit.steps.find(x=>x.p===pid); return { s:r.s||st.ps, e:r.e||st.pe }; }
  // 否则默认取这批设备的排产窗口；独立工序（铜排线）前置 2 天
  let s0='', e0='';
  devListOf(sel).forEach(d=>{ if(!d.planStart) return;
    if(!s0||d.planStart<s0) s0=d.planStart;
    if(!e0||d.planEnd>e0) e0=d.planEnd; });
  if(!s0){ s0=o.plan?o.plan.start:''; e0=o.plan?o.plan.end:''; }
  const dft=PROC[pid].ind? { s:s0?addD(s0,-2):'', e:s0?addD(s0,-1):'' } : { s:s0, e:e0 };
  return { s:r.s||dft.s, e:r.e||dft.e };
}
function setProcDate(pid,k,v){
  S.pdc=S.pdc||{};
  const o=proj(S.cur), sel=(S.asgSelCur||S.sel)||[];
  const cur=asgRowDate(o,pid,sel);
  const r=S.pdc[pid]||(S.pdc[pid]={ s:cur.s, e:cur.e });
  r[k]=v;
  if(r.s&&r.e&&r.e<r.s){ if(k==='e') r.s=v; else r.e=v; }
  renderPanel();
}

/* ---- 项目立项审核 ---- */
function doProjAudit(id,pass){
  const r=LIXIANG.find(x=>x.id===id);
  if(!r||r.st!=='pending') return;
  if(pass){
    const craft = r.model==='KDC-12' ? 'GY01' : (r.model==='KDC-08' ? 'GY02' : 'GY03');
    const today=TODAY.replace(/-/g,'');
    const n=PROJ.filter(p=>p.id.indexOf('MO-'+today)===0).length+1;
    const pid='MO-'+today+'-'+String(n).padStart(2,'0');
    const p={ id:pid, name:r.name, cus:r.cus, product:r.product, model:r.model, qty:r.qty, craft,
      ws:'总装车间', due:r.wantEnd, st:'pending_review', wantStart:r.wantStart,
      from:'立项审核通过 · '+r.sales };
    PROJ.push(p); mkDevices(p);
    r.st='passed'; r.pid=pid;
    toast(`立项通过：生成项目 ${pid} 与 ${r.qty} 台设备，进入任务书审核`,'ok');
  } else {
    const note=(val('paNote')||'').trim();
    if(!note){ toast('驳回请填写审核意见','err'); return; }
    r.st='rejected'; r.reason=note;
    toast('已驳回该立项申请，退回销售部','err');
  }
  S.cur=null; render();
}

function doAssign(id){
  if(!S.sel.length||!S.procs.length){ toast('请先勾选设备与工序','err'); return; }
  const p=proj(id);
  S.asgSelCur=S.sel.slice();
  S.sel.forEach(sn=>{ const d=dev(sn);
    S.procs.forEach(pid=>{
      const st=d.steps.find(x=>x.p===pid); if(!st) return;
      st.g=(S.procGroup&&S.procGroup[pid])||procGroups(pid)[0]||GROUPS[0].id;
      const dr=asgRowDate(p,pid,S.asgSelCur);          // 工序计划：默认排产窗口，可在派单页调整
      if(dr.s) st.ps=dr.s;
      if(dr.e) st.pe=dr.e;
    }); });
  const all=devOf(id).every(d=>d.steps.every(s=>s.g));
  if(all) p.st='assigned';
  toast(`${S.sel.length} 台设备 × ${S.procs.length} 道工序已派单`);
  S.sel=[]; S.procs=null; render();
}

function wizMat(empId,c,v){ const w=S.wiz; w.mats[empId]=w.mats[empId]||{}; w.mats[empId][c]=Math.max(0,parseInt(v||0,10)||0); }

function wizMats(){
  const w=S.wiz;
  const list=(w.matList||batchMatList(w.devs));
  w.emps.forEach(id=>{
    const n=wizLeadN(id);                    // 主责台数：共同负责的那台只算给主责人，避免重复领料
    w.mats[id]=w.mats[id]||{};
    list.forEach(m=>{
      if(m.aux) return;                      // 辅料不进个人领料单
      const cur=w.mats[id][m.c];
      if(!n){ w.mats[id][m.c]=0; return; }
      if(m.procs.includes(w.proc)){          // 本工序的料：按主责台数算好
        if(cur==null||cur===0||cur%m.per===0) w.mats[id][m.c]=Math.ceil(m.per*n);
      } else if(cur==null){ w.mats[id][m.c]=0; }   // 其它工序的料：默认不领，组长说了算
    });
  });
}

  if(on){ const n=wizLeadN(empId)||1; w.mats[empId][code]=Math.ceil((m?m.per:1)*n); }

  const id=nextNo('PG'), p=proj(w.proj);

    mats:Object.keys(w.mats[e]||{}).filter(c=>+w.mats[e][c]>0).map(c=>({c,q:+w.mats[e][c]})) })).filter(x=>x.devs.length);
  const aux=(MAT[w.proc]||[]).filter(m=>m.aux).map(m=>({c:m.c,q:Math.ceil(m.per*w.devs.length)}));
  DISPATCH.push({ id, proj:w.proj, proc:w.proc, group:gid, devs:w.devs.slice(), workers, aux, start:w.start, end:w.end, st:'doing' });
  w.devs.forEach(sn=>{ const d=dev(sn), st=d.steps.find(s=>s.p===w.proc), arr=w.devEmp[sn]||[];
    if(st){ st.e=arr[0]||''; st.es=arr.slice(); st.d=id; st.st='doing'; } });   // 第一个为主责，其余为协作
  workers.forEach(x=>{ if(x.mats.length){
    const mn=(MAT[w.proc]||[]);
    PICK.push({ no:nextNo('LL'), dispId:id, emp:x.emp, st:'待领',
      items:x.mats.map(m=>({ c:m.c, n:(mn.find(z=>z.c===m.c)||{}).n||m.c, q:m.q, wh:(mn.find(z=>z.c===m.c)||{}).wh||'' })) });
  }});
  if(p.st==='assigned'||p.st==='scheduled') p.st='producing';
  const coopN=w.devs.filter(sn=>(w.devEmp[sn]||[]).length>1).length;
  toast(`${PROC[w.proc].name} 派工完成：${w.devs.length} 台 · ${workers.length} 人${coopN?`（其中 ${coopN} 台两人共同负责）`:''}，已生成 ${workers.length} 张个人领料单`,'ok');
  S.wiz=null; S.sub=null; S.sel=[]; go('pick',id);
}

/* ---- 领料 ---- */
function doPick(no){
  const s=PICK.find(x=>x.no===no); if(!s) return;
  s.st='done';
  const d=DISPATCH.find(x=>x.id===s.dispId); if(d&&d.st==='doing') d.st='working';
  toast(`${emp(s.emp).name} 的领料单 ${no} 已出库（打印 1 份）`,'ok');
  renderPanel();
}

/* ---- 报工 ---- */
function val(id){ const el=$(id); return el?el.value:''; }
function doReport(sn){
  const d=dev(sn), cur=devCurStep(d);
  if(!cur){ toast('这台设备的工序都已完工','err'); return; }
  const inst=parseInt(val('rInst')||0,10)||0, ok=parseInt(val('rOk')||0,10)||0,
        good=parseInt(val('rGood')||0,10)||0, bad=parseInt(val('rBad')||0,10)||0;
  if(!inst&&!ok&&!good){ toast('请填写安装件数或完成台数','err'); return; }
  cur.inst+=inst; cur.ok+=Math.max(ok,good);
  if(ok>=1){ cur.st='done'; cur.ok=1; }
  REPORT.push({ id:'RB-'+REPORT.length+1, dev:sn, proc:cur.p, emp:cur.e||ME(), date:TODAY, inst, ok, bad, note:val('rNote') });
  const p=proj(d.proj); if(p.st!=='producing') p.st='producing';
  toast(`${sn} 报工成功${ok>=1?'，'+PROC[cur.p].name+' 已完工，流转到下一道工序':''}`,'ok');
  renderPanel();
}

/* ---- 检验入库 ---- */
function chkSelf(i){ const d=dev(S.cur); d.self.items=d.self.items||{}; d.self.items[i]=!d.self.items[i]; renderPanel(); }
function doInbound(sn){
  const d=dev(sn), name=$('signName')?val('signName'):'';
  d.inbound=nextNo('RK'); d.self.by=name||'王志强'; d.self.at=TODAY+' 17:20'; d.qc='合格';
  const p=proj(d.proj);
  if(devOf(p.id).every(x=>x.inbound)) p.st='inbounded';
  toast(`${sn} 已入生产成品库 · 入库单 ${d.inbound}`,'ok');
  renderPanel();
}

/* ---- 角色 ---- */
function switchRole(r){
  S.role=r; S.page = r==='director'?'proj':(r==='leader'?'work':'mytask');
  S.cur=null; S.sel=[]; S.sub=null; S.wiz=null; S.procs=null; S.pg=null; S.pd=null; S.pdc=null; __lastPage=S.page;
  render();
  toast(`已切换为「${r==='director'?'生产主任':r==='leader'?'班组长':'生产员工'}」视角`);
}
/* ============================ 12. 导航与渲染 ============================ */
const NAV = {

  plan: SVG('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),

  pick: SVG('<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>'),
  report: SVG('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>'),

const VIEWS = { proj:viewProj, todo:viewTodo, projaudit:viewProjAudit, audit:viewAudit, proc:viewProc, craft:viewCraft,
  plan:viewPlan, assign:viewAssign, track:viewTrack, pay:viewPay,
  work:viewWork, pick:viewPick, report:viewReport, inbound:viewInbound,
  mytask:viewMyTask, mypick:viewMyPick, mypay:viewMyPay };
const PAGE_TXT = { proj:'项目管理', todo:'待办', projaudit:'项目立项审核', audit:'任务书审核', proc:'工序', craft:'工艺',
  plan:'排产', assign:'派单', track:'项目跟踪', pay:'计件', work:'派工', pick:'领料', report:'报工', inbound:'入库',
  mytask:'我的任务', mypick:'我的领料', mypay:'我的计件' };
const ROLE_TXT = { director:'生产主任', leader:'班组长', worker:'生产员工' };

function navBadge(k){
  const c=counts();
  if(k==='todo') return c.pendProj+c.pendAudit+c.pendPlan+c.pendAssign+c.pendWork+c.late;
  if(k==='projaudit') return c.pendProj;
  if(k==='audit') return c.pendAudit;
  if(k==='plan') return c.pendPlan;
  if(k==='assign') return c.pendAssign;
  if(k==='work') return DEV.filter(d=>d.steps.some(s=>s.g===G()&&!s.e)).length;
  if(k==='report') return DEV.filter(d=>!d.inbound&&d.steps.some(s=>s.st==='doing')).length;
  if(k==='inbound') return c.pendIn;
  if(k==='mytask') return myDevs().length;
  if(k==='mypick') return PICK.filter(s=>s.emp===ME()&&s.st!=='done').length;
  return 0;
}
function toggleNav(){ document.body.classList.toggle('navc'); }
function render(){
  if(__lastPage!==S.page){ S.cur=null; S.sel=[]; S.sub=null; S.wiz=null; S.procs=null; S.procGroup=null; S.pd=null; S.pg=null; }
  __lastPage=S.page;
  $('roles').innerHTML = ['director','leader','worker'].map(r=>
    `<button class="${S.role===r?'on':''}" onclick="switchRole('${r}')">${ROLE_TXT[r]}</button>`).join('');
  $('who').innerHTML = S.role==='leader'
    ? `<select class="btn sm" onchange="S.gid=this.value;S.cur=null;S.sel=[];render()">
        ${GROUPS.map(g=>`<option value="${g.id}" ${g.id===S.gid?'selected':''}>${g.name} · ${emp(g.leader).name}</option>`).join('')}</select>`
    : S.role==='worker'
    ? `<select class="btn sm" onchange="S.me=this.value;S.cur=null;render()">
        ${EMP.map(e=>`<option value="${e.id}" ${e.id===ME()?'selected':''}>${e.name} · ${grp(e.g).name}</option>`).join('')}</select>`
    : '张建军 · 生产主任';
  $('nav').innerHTML = NAV[S.role].map(([k,t])=>{
    const b=navBadge(k);
    return `<button class="${S.page===k?'on':''}" title="${t}" onclick="go('${k}')"><span class="ic">${ICONS[k]||''}</span><span class="nm">${t}</span>${b?`<span class="bdg">${b}</span>`:''}</button>`;
  }).join('');
  $('crumb').innerHTML = `<span class="cc">${PAGE_TXT[S.page]||''}</span>`;
  document.body.classList.toggle('wide', ['proj','proc','craft','plan'].includes(S.page));
  const who = S.role==='director' ? '张建军' : S.role==='leader' ? emp(grp(S.gid||'G1').leader).name : emp(ME()).name;
  $('avatar').textContent = who.slice(-1);
  const v=(VIEWS[S.page]||viewTodo)();
  $('lh').innerHTML = `<h3>${v.lh[0]}</h3><p>${v.lh[1]}</p>`;
  $('list').innerHTML = v.list;
  $('panel').innerHTML = `<div class="back" style="margin-bottom:10px"><button class="btn sm" onclick="backList()">← 返回列表</button></div>` + v.panel;
}
function renderPanel(){
  const v=(VIEWS[S.page]||viewTodo)();
  $('panel').innerHTML = `<div class="back" style="margin-bottom:10px"><button class="btn sm" onclick="backList()">← 返回列表</button></div>` + v.panel;
}
S.gid='G1'; S.me='E12';
/* URL 参数直达（便于评审/演示）：?role=director&page=plan&cur=MO-20260917-01&gid=G1&me=E12 */
(function(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('role')) S.role=q.get('role');
    if(q.get('gid')) S.gid=q.get('gid');
    if(q.get('me')) S.me=q.get('me');
    if(q.get('page')) S.page=q.get('page');
    if(q.get('cur')) S.cur=q.get('cur');
    if(S.role==='leader'&&!q.get('page')) S.page='work';
    __lastPage=S.page;
    if(q.get('sub')==='wiz' && S.page==='work' && S.cur){
      const gid=S.gid||'G1';
      S.sel=devOf(S.cur).filter(d=>d.steps.some(s=>s.g===gid&&!s.e)).map(d=>d.sn);
      if(S.sel.length){ startWiz(S.cur); return; }
    }
    if(q.get('sub')==='tr' && S.page==='pick' && S.cur){
      const x=DISPATCH.filter(y=>y.id===S.cur)[0];
      if(x&&x.workers.length){ trStart(x.id, x.workers[0].emp); return; }
    }
  }catch(e){}
})();
render();
window.addEventListener('resize',()=>{ if(window.innerWidth>900) document.body.classList.remove('mobile-panel'); });
</script>
