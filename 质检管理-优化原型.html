<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOM 制造运营管理系统 - 质检管理</title>
<style>
  :root{
    --side-bg:#1c2a3e;
    --side-bg2:#182435;
    --side-active:#2f7bf6;
    --side-text:#8fa0b5;
    --primary:#2f7bf6;
    --primary-dark:#1f66d8;
    --orange:#f59a23;
    --green:#1fc97f;
    --red:#f5534c;
    --purple:#8b5cf6;
    --cyan:#13b8cd;
    --text:#303133;
    --text2:#606266;
    --text3:#909399;
    --bg:#f0f2f5;
    --card:#ffffff;
    --line:#eef1f6;
    --radius:10px;
    --shadow:0 1px 3px rgba(28,42,62,.06);
    --shadow-lg:0 12px 40px rgba(20,40,80,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
  .app{display:flex;height:100vh}

  /* ============ 侧边栏 ============ */
  .sider{width:208px;min-width:208px;background:linear-gradient(180deg,var(--side-bg),var(--side-bg2));color:var(--side-text);display:flex;flex-direction:column;transition:width .2s}
  .sider .logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
  .logo-badge{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#f59a23,#f0663a);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;letter-spacing:-1px}
  .logo-name{font-size:16px;font-weight:700;letter-spacing:1px}
  .menu{flex:1;overflow-y:auto;padding:10px 0}
  .menu-item{display:flex;align-items:center;gap:10px;margin:4px 10px;padding:11px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--side-text);transition:.15s;user-select:none}
  .menu-item .mi{width:18px;text-align:center;font-size:15px}
  .menu-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .menu-item.active{background:var(--side-active);color:#fff;box-shadow:0 6px 16px rgba(47,123,246,.35)}
  .menu-group{padding:16px 24px 6px;font-size:11px;letter-spacing:2px;color:#5c6d84}
  .sider-foot{padding:14px 18px;font-size:11px;color:#5c6d84;border-top:1px solid rgba(255,255,255,.06)}

  /* ============ 主区 ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;background:#fff;display:flex;align-items:center;padding:0 22px;box-shadow:0 1px 4px rgba(28,42,62,.06);z-index:5}
  .topbar .fold{font-size:18px;color:var(--text2);cursor:pointer;margin-right:14px}
  .crumb{color:var(--text3);font-size:14px}
  .crumb b{color:var(--text);font-weight:600}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:22px;color:var(--text2)}
  .top-ico{position:relative;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px}
  .top-ico .dot{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2f7bf6,#6ea8ff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}

  .page{flex:1;overflow-y:auto;padding:18px 20px 26px}

  /* ============ 统计卡 ============ */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:14px;align-items:center;cursor:pointer;border:1px solid transparent;transition:.18s;position:relative;overflow:hidden}
  .stat:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(28,42,62,.1)}
  .stat.on{border-color:var(--primary)}
  .stat.on::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
  .stat .ic{width:46px;height:46px;min-width:46px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .stat .ic svg{width:24px;height:24px}
  .stat .lab{font-size:13px;color:var(--text3)}
  .stat .num{font-size:26px;font-weight:700;line-height:1.15;color:var(--text);font-family:Arial,"Microsoft YaHei"}
  .stat .sub{font-size:12px;color:var(--text3)}
  .ic.blue{background:#e9f2ff;color:var(--primary)} .ic.orange{background:#fff3e2;color:var(--orange)}
  .ic.green{background:#e6faf1;color:#0fa868} .ic.red{background:#ffecec;color:var(--red)}
  .ic.purple{background:#f1ecff;color:var(--purple)} .ic.cyan{background:#e4f8fa;color:#0d97aa}
  .ic.gray{background:#f0f2f5;color:#7a8599}

  /* ============ 面板 ============ */
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
  .panel-head{display:flex;align-items:center;margin-bottom:14px}
  .panel-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .panel-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--primary)}
  .panel-tools{margin-left:auto;display:flex;gap:10px}

  /* ============ 按钮 ============ */
  .btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #dcdfe6;background:#fff;color:var(--text2);border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
  .btn:hover{color:var(--primary);border-color:#b5d2ff;background:#f3f8ff}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.pri:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
  .btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn.warn:hover{background:#e08a12;border-color:#e08a12;color:#fff}
  .btn.danger-soft{color:var(--red);border-color:#fbc4c4;background:#fff}
  .btn.danger-soft:hover{background:#fef0f0;border-color:var(--red);color:var(--red)}
  .btn.sm{padding:4px 11px;font-size:12px;border-radius:5px}
  .btn.block{width:100%;justify-content:center}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .link-btn{color:var(--primary);cursor:pointer;font-size:13px;user-select:none}
  .link-btn:hover{text-decoration:underline}

  /* ============ 筛选区 ============ */
  .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-bottom:14px}
  .f-item{display:flex;align-items:center;gap:8px}
  .f-item>label{width:70px;min-width:70px;text-align:right;color:var(--text2);font-size:13px}
  .f-ctl{flex:1;position:relative}
  input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #dcdfe6;border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);outline:none;transition:.15s;background:#fff;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,123,246,.12)}
  input::placeholder,textarea::placeholder{color:#b6bac2}
  textarea{resize:vertical;min-height:60px}
  .f-more{display:flex;align-items:center;gap:10px;margin:-2px 0 14px;padding-left:78px;justify-content:flex-end}
  .fold-link{color:var(--primary);font-size:13px;cursor:pointer;user-select:none}

  /* ============ 表格 ============ */
  .tbl-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
  .tbl th{background:#f0f6ff;color:var(--text);font-weight:600;font-size:13px;text-align:left;padding:11px 12px;white-space:nowrap;position:sticky;top:0;z-index:2}
  .tbl td{padding:10px 12px;font-size:13px;color:var(--text2);border-top:1px solid var(--line);white-space:nowrap}
  .tbl tbody tr{transition:.12s}
  .tbl tbody tr:hover{background:#f7faff}
  .tbl .ops{display:flex;gap:6px}
  .mono{font-family:Consolas,Menlo,monospace;font-size:12.5px;color:var(--text)}
  .num-strong{font-weight:700;color:var(--text)}
  .pass{color:#0fa868;font-weight:600}.fail{color:var(--red);font-weight:600}
  .empty{padding:46px 0;text-align:center;color:var(--text3)}
  .empty .e-ic{font-size:38px;margin-bottom:8px;opacity:.5}

  /* ============ 标签 ============ */
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:12px;line-height:18px;white-space:nowrap}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .tag.plain::before{display:none}
  .t-blue{background:#e9f2ff;color:var(--primary)} .t-green{background:#e6faf1;color:#0fa868}
  .t-orange{background:#fff3e2;color:#d97b06} .t-red{background:#ffecec;color:#e03131}
  .t-gray{background:#f0f2f5;color:#7a8599} .t-purple{background:#f1ecff;color:var(--purple)}
  .t-cyan{background:#e4f8fa;color:#0d97aa}
  .badge-key{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:#ffece8;color:#e03131;border:1px solid #ffc9c2}
  .badge-general{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:#f0f2f5;color:#7a8599}

  /* ============ 分页 ============ */
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:14px;font-size:13px;color:var(--text3)}
  .pg{min-width:28px;height:28px;padding:0 6px;border:1px solid #dcdfe6;border-radius:5px;background:#fff;color:var(--text2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12.5px}
  .pg:hover{color:var(--primary);border-color:var(--primary)}
  .pg.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .pg.dis{opacity:.45;cursor:not-allowed}
  select.pg-sel{width:auto;padding:4px 6px;border-radius:5px}

  /* ============ 弹窗 ============ */
  .mask{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px 4vh;overflow:auto;animation:fadeIn .18s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);width:680px;max-width:96vw;animation:pop .2s;margin-bottom:5vh}
  .modal.w960{width:960px}.modal.w1120{width:1120px}
  .mask.drawer{padding:0;justify-content:flex-end}
  .mask.drawer .modal{width:920px;max-width:94vw;height:100vh;margin:0;border-radius:0;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(20,40,80,.22);animation:slideIn .22s}
  .mask.drawer .m-body{flex:1;overflow-y:auto}
  .mask.drawer .m-head,.mask.drawer .m-foot{flex-shrink:0}
  @keyframes slideIn{from{transform:translateX(60px);opacity:.4}to{transform:none;opacity:1}}
  .m-head{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
  .m-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .m-close{margin-left:auto;width:28px;height:28px;border-radius:6px;border:none;background:none;color:var(--text3);font-size:16px;cursor:pointer}
  .m-close:hover{background:#f0f2f5;color:var(--text)}
  .m-body{padding:18px 22px}
  .m-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

  /* 描述列表 */
  .desc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 22px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
  .desc .d-item{font-size:13px;min-width:0}
  .desc .d-lab{color:var(--text3);margin-right:6px}
  .desc .d-val{color:var(--text);font-weight:600}
  .sec-t{font-size:14px;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .sec-t .hint{font-weight:400;font-size:12px;color:var(--text3)}
  .sec-t::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--primary)}

  /* 步骤条 */
  .steps{display:flex;align-items:center;margin-bottom:18px}
  .step{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:13px}
  .step .sn{width:26px;height:26px;border-radius:50%;background:#eef1f6;color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;transition:.2s}
  .step.on{color:var(--primary);font-weight:600}
  .step.on .sn{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(47,123,246,.35)}
  .step.done{color:#0fa868}.step.done .sn{background:#e6faf1;color:#0fa868}
  .sline{flex:1;height:1px;background:#e5e9f0;margin:0 12px;min-width:30px}

  /* 表单 */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
  .fg{display:flex;flex-direction:column;gap:6px}
  .fg.full{grid-column:1/-1}
  .fg label{font-size:13px;color:var(--text2)}
  .fg label .req{color:var(--red);margin-right:2px}
  .radio-line{display:flex;gap:16px;align-items:center;padding-top:4px;font-size:13px}
  .radio-line label{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--text)}

  /* 明细行内标签 */
  .mini-tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px}

  /* 进度条 */
  .bar{height:6px;border-radius:3px;background:#eef1f6;overflow:hidden;min-width:80px}
  .bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#1fc97f,#5fe0a8)}
  .bar-wrap{display:flex;align-items:center;gap:8px}

  /* 审批流 */
  .flow{margin-top:6px}
  .flow-node{display:flex;gap:12px;position:relative;padding-bottom:22px}
  .flow-node:last-child{padding-bottom:2px}
  .flow-node::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:#e5e9f0}
  .flow-node:last-child::before{display:none}
  .fn-dot{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:1}
  .fn-dot.ok{background:#e6faf1;color:#0fa868} .fn-dot.cur{background:#e9f2ff;color:var(--primary)} .fn-dot.wait{background:#f0f2f5;color:#b6bac2}
  .fn-body .fn-t{font-size:13.5px;font-weight:600}
  .fn-body .fn-s{font-size:12px;color:var(--text3);margin-top:2px}

  /* toast */
  #toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#fff;box-shadow:0 6px 24px rgba(20,40,80,.18);border-radius:8px;padding:10px 18px;font-size:13px;display:flex;gap:8px;align-items:center;animation:pop .2s;border-left:3px solid var(--green)}
  .toast.err{border-left-color:var(--red)} .toast.info{border-left-color:var(--primary)}

  .up-box{border:1px dashed #d3d9e2;border-radius:6px;padding:6px;text-align:center;color:var(--text3);font-size:11px;cursor:pointer;min-width:56px;background:#fafbfc}
  .up-box:hover{border-color:var(--primary);color:var(--primary)}
  .up-box img{width:44px;height:44px;object-fit:cover;border-radius:4px}

  .quick-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .sum-box{display:flex;gap:26px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:14px;flex-wrap:wrap}
  .sum-item{font-size:13px;color:var(--text3)}
  .sum-item b{font-size:18px;color:var(--text);margin-left:6px;font-family:Arial}
  .sum-item .ok{color:#0fa868}.sum-item .no{color:var(--red)}
  .sum-item input{width:88px;display:inline-block;padding:5px 8px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#c8cdd6;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sider">
    <div class="logo"><div class="logo-badge">MOM</div><div class="logo-name">制造运营管理</div></div>
    <nav class="menu" id="menu">
      <div class="menu-group">质检管理</div>
      <div class="menu-item" data-p="qc"><span class="mi" id="miQc"></span>质检任务</div>
      <div class="menu-item" data-p="ncr"><span class="mi" id="miNcr"></span>不合格品</div>
      <div class="menu-item" data-p="type"><span class="mi" id="miType"></span>质检类型管理</div>
    </nav>
    <div class="sider-foot">MOM · 质检管理 v2.0</div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar">
      <span class="fold" onclick="document.querySelector('.sider').style.display='none'">☰</span>
      <div class="crumb">首页 / 质检管理 / <b id="crumb">质检任务</b></div>
      <div class="top-right">
        <div class="top-ico">🔔<span>消息</span><i class="dot" id="msgDot">0</i></div>
        <div class="top-ico">❓<span>帮助</span></div>
        <div class="top-ico"><div class="avatar">管</div><span>超级管理员</span></div>
      </div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* ==================== 数据 ==================== */
const QC_ITEMS_JL02 = [
  {no:0,name:'包装防护',basis:'包装完好无破损，防潮防锈措施到位，运输无磕碰变形',method:'合格判定',tool:'目测',key:false},
  {no:1,name:'表面处理',basis:'喷涂/镀层均匀，无色差、无流挂、无起泡、无明显划伤',method:'合格判定',tool:'目测',key:false},
  {no:2,name:'板材厚度',basis:'实测板厚与图纸标称一致，偏差不超过 ±0.10mm',method:'实测值',tool:'游标卡尺',key:true},
  {no:3,name:'外形尺寸',basis:'长宽高关键尺寸符合图纸要求，偏差在公差范围内',method:'实测值',tool:'卷尺/卡尺',key:true},
  {no:4,name:'孔位精度',basis:'安装孔位置、孔径与图纸一致，与配套件可正常装配',method:'合格判定',tool:'试装/卡尺',key:true},
  {no:5,name:'焊接质量',basis:'焊缝饱满连续，无漏焊、无气孔、无裂纹',method:'合格判定',tool:'目测',key:false},
];
const QC_ITEMS_JL03 = [
  {no:0,name:'装配牢固度',basis:'螺栓力矩达标，无松动，件与件贴合无缝隙',method:'合格判定',tool:'力矩扳手',key:true},
  {no:1,name:'一次回路接线',basis:'相序正确、压接牢固，符合 GB 7251 装配要求',method:'合格判定',tool:'接线图核对',key:true},
  {no:2,name:'二次线号标识',basis:'线号清晰、与图纸一致，套向统一',method:'合格判定',tool:'目测',key:false},
  {no:3,name:'绝缘电阻',basis:'一次回路对地 ≥10MΩ（500V 兆欧表）',method:'实测值',tool:'兆欧表',key:true},
];
const QC_ITEMS_JL04 = [
  {no:0,name:'工频耐压',basis:'2500V/1min 无击穿无闪络',method:'实测值',tool:'耐压测试仪',key:true},
  {no:1,name:'通电功能',basis:'各回路通电动作正确，五防联锁可靠',method:'合格判定',tool:'通电台',key:true},
  {no:2,name:'外观清洁',basis:'柜内无异物、无划伤，封板齐全',method:'合格判定',tool:'目测',key:false},
];
const QC_ITEMS_JL01 = [
  {no:0,name:'元件外观',basis:'无破损、无引脚氧化，标识清晰',method:'合格判定',tool:'目测',key:false},
  {no:1,name:'参数抽测',basis:'容值/阻值在标称 ±5% 内',method:'实测值',tool:'LCR 表',key:true},
  {no:2,name:'规格核对',basis:'型号与 BOM 一致，封装尺寸匹配',method:'合格判定',tool:'图纸核对',key:true},
];

function toast(msg,type='ok'){
  const el=document.createElement('div');el.className='toast '+(type==='err'?'err':type==='info'?'info':'');
  el.innerHTML=(type==='err'?'❌ ':type==='info'?'ℹ️ ':'✅ ')+esc(msg);

}

let modalStack=[];
function openModal(html,cls=''){const m=document.createElement('div');m.className='mask';m.innerHTML=`<div class="modal ${cls}">${html}</div>`;
  m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});
  $('#modalRoot').appendChild(m);modalStack.push(m);return m}
function openDrawer(html){const m=document.createElement('div');m.className='mask drawer';m.innerHTML=`<div class="modal">${html}</div>`;
  m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});
  $('#modalRoot').appendChild(m);modalStack.push(m);return m}
function closeModal(){const m=modalStack.pop();if(m)m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ==================== 分页组件 ==================== */
function pager(total,cur,size,onChangeName){
  const pages=Math.max(1,Math.ceil(total/size));
  let nums=[];for(let i=1;i<=pages;i++){if(pages<=7||i<=2||i>pages-1||Math.abs(i-cur)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…')}
  return `<div class="pager">共 ${total} 条，每页
    <select class="pg-sel" onchange="${onChangeName}(1,+this.value)"><option ${size==10?'selected':''}>10</option><option ${size==20?'selected':''}>20</option><option ${size==50?'selected':''}>50</option></select> 条
    <span class="pg dis">‹</span>${nums.map(n=>n==='…'?'<span class="pg dis">…</span>':`<span class="pg ${n==cur?'on':''}" onclick="${onChangeName}(${n})">${n}</span>`).join('')}<span class="pg ${cur>=pages?'dis':''}">›</span></div>`;
}

/* ==================== 质检任务页 ==================== */
const qcFilter={kw:'',status:'',user:'',type:'',page:1,size:10,more:false};
function qcFiltered(){
  return qcList.filter(q=>{
    if(qcFilter.status&&q.status!==qcFilter.status)return false;
    if(qcFilter.user&&q.user!==qcFilter.user)return false;
    if(qcFilter.type&&!q.lines.some(l=>l.type===qcFilter.type))return false;
    if(qcFilter.kw){const k=qcFilter.kw.toLowerCase();
      const hay=(q.id+q.rc+q.user+q.note+q.lines.map(l=>l.mat+l.code).join('')).toLowerCase();
      if(!hay.includes(k))return false}
    return true;
  });
}
function qcStats(){
  const wait=qcList.filter(q=>q.status==='待质检').length;
  const done=qcList.filter(q=>q.status==='已完成').length;
  const month=qcList.filter(q=>q.time.startsWith(today().slice(0,7))).length;
  const allPass=qcList.filter(q=>q.status==='已完成');
  const rate=allPass.length?Math.round(allPass.filter(q=>q.lines.every(l=>l.r.fail===0)).length/allPass.length*100):100;
  return {all:qcList.length,wait,done,month,rate};
}
function renderQc(){
  const s=qcStats(),rows=qcFiltered(),tp=Math.max(1,Math.ceil(rows.length/qcFilter.size));
  if(qcFilter.page>tp)qcFilter.page=tp;
  const pr=rows.slice((qcFilter.page-1)*qcFilter.size,qcFilter.page*qcFilter.size);
  const card=(ic,cls,lab,num,sub,st)=>`<div class="stat ${qcFilter.status===st&&st?'on':''}" onclick="qcByStatus('${st}')">
      <div class="ic ${cls}">${ic}</div><div><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub}</div></div></div>`;
  $('#page').innerHTML=`
  <div class="stats">
    ${card(ICONS.clipboard,'blue','全部质检单',s.all,'本月新增 '+s.month,'')}
    ${card(ICONS.hourglass,'orange','待质检',s.wait,'点击筛选待质检','待质检')}
    ${card(ICONS.check,'green','已完成',s.done,'合格率 '+s.rate+'%','已完成')}
    ${card(ICONS.alert,'red','不合格处置单',ncrList.filter(n=>n.status==='待提交'||n.status==='审批中').length,'待提交/审批中','')}
    ${card(ICONS.folder,'purple','启用质检类型',types.filter(t=>t.status==='启用').length,'共 '+types.length+' 个类型','')}
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">质检清单</div>
      <div class="panel-tools"><button class="btn pri" onclick="openNewQc()">＋ 新建质检单</button></div></div>
    <div class="filters">
      <div class="f-item"><label>关键字</label><div class="f-ctl"><input type="text" id="qcKw" placeholder="质检单号 / 到货单号 / 物料名称" value="${esc(qcFilter.kw)}" onkeydown="if(event.key==='Enter')qcSearch()"></div></div>
      <div class="f-item"><label>状态</label><div class="f-ctl"><select id="qcStatus"><option value="">全部状态</option>${['待质检','已完成'].map(x=>`<option ${qcFilter.status==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="f-item"><label>质检人员</label><div class="f-ctl"><select id="qcUser"><option value="">全部人员</option>${users.map(u=>`<option ${qcFilter.user==u?'selected':''}>${u}</option>`).join('')}</select></div></div>
    </div>
    ${qcFilter.more?`<div class="filters" style="grid-template-columns:repeat(3,1fr)">
      <div class="f-item"><label>质检类型</label><div class="f-ctl"><select id="qcType"><option value="">全部类型</option>${types.map(t=>`<option ${qcFilter.type==t.name?'selected':''}>${t.name}</option>`).join('')}</select></div></div>
    </div>`:''}
    <div class="f-more" style="padding-left:0;margin-left:auto">
      <button class="btn pri" onclick="qcSearch()">查 找</button>
      <button class="btn" onclick="qcReset()">重 置</button>

    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>质检单号</th><th>到货单号</th><th>物料行数</th><th>质检类型</th><th>状态</th><th>质检人员</th><th>质检时间</th><th>备注</th><th style="min-width:150px">操作</th></tr></thead>
      <tbody>${pr.length?pr.map(q=>{
        const tset=[...new Set(q.lines.map(l=>l.type))].join('、');
        return `<tr>
        <td><span class="mono" style="color:var(--primary);font-weight:600;cursor:pointer" onclick="openQcDetail('${q.id}')">${q.id}</span></td>
        <td class="mono">${q.rc}</td>

}
function qcByStatus(st){qcFilter.status=(st&&qcFilter.status===st)?'':st;qcFilter.page=1;renderQc()}
function qcSearch(){qcFilter.kw=$('#qcKw').value.trim();qcFilter.status=$('#qcStatus').value;qcFilter.user=$('#qcUser').value;
  if(qcFilter.more)qcFilter.type=$('#qcType')?$('#qcType').value:qcFilter.type;qcFilter.page=1;renderQc()}
function qcReset(){Object.assign(qcFilter,{kw:'',status:'',user:'',type:'',page:1});renderQc();toast('筛选条件已重置','info')}
function qcPage(n){qcFilter.page=n;renderQc()}
function delQc(id){if(!confirm('确认删除质检单 '+id+' ？删除后不可恢复。'))return;
  qcList=qcList.filter(q=>q.id!==id);renderQc();toast('质检单 '+id+' 已删除')}
function qcGoFill(id){openQcDetail(id);const q=qcList.find(x=>x.id===id);const li=q.lines.findIndex(l=>l.r.concl==='待质检');if(li>=0)openFill(id,li)}

  openModal(`
  <div class="m-head"><div class="m-title">📋 质检单 · ${q.id}</div>${tag(q.status,statusColor[q.status])}<span style="margin-left:10px"></span>
    <button class="m-close" onclick="closeModal()">✕</button></div>

/* ---- 填写质检 ---- */
function openFill(qid,li){
  const q=qcList.find(x=>x.id===qid),line=q.lines[li],r=line.r;
  const t=typeByName(line.type);const tpl=(t?t.items:[]);
  if(!r.checks.length)r.checks=tpl.map(i=>({name:i.name,ok:null,val:'',img:''}));
  const checks=r.checks;
  function render(){
    const done=checks.filter(c=>c.ok!==null).length;
    openDrawer(`
    <div class="m-head"><div class="m-title">🧾 填写物料质检 · ${esc(line.mat)}</div><span style="margin-left:10px"></span>${tag(q.id,'blue')}
      <button class="m-close" onclick="closeModal()">✕</button></div>
    <div class="m-body">
      <div class="desc" style="grid-template-columns:repeat(4,1fr)">
        <div class="d-item"><span class="d-lab">物料编码：</span><span class="d-val mono" style="font-size:12px">${line.code}</span></div>
        <div class="d-item"><span class="d-lab">质检类型：</span><span class="d-val">${esc(line.type)}</span></div>
        <div class="d-item"><span class="d-lab">质检数量：</span><span class="d-val">${r.qty}</span></div>
        <div class="d-item"><span class="d-lab">完成进度：</span><span class="d-val">${done}/${checks.length} 项</span></div>
      </div>
      <div class="sec-t">检验项目 <span class="hint">建单时按所选质检类型绑定，逐项判定</span>
        <span style="margin-left:auto;display:flex;gap:8px">
          <button class="btn sm" onclick="fillAllOk()">✔ 全部合格</button>
        </span></div>
      <div class="tbl-wrap"><table class="tbl" style="min-width:760px">
        <thead><tr><th>序号</th><th>检验项目</th><th>检验依据 / 标准要求</th><th>判定方式</th><th>实测值 / 结果</th><th>结论</th><th>图片</th></tr></thead>
        <tbody>${checks.map((c,i)=>{const tp2=tpl[i]||{};return `<tr>
          <td>${i+1}</td>
          <td class="num-strong">${esc(c.name)} ${tp2.key?'<span class="badge-key">关键项</span>':'<span class="badge-general">一般项</span>'}</td>
          <td style="max-width:230px;white-space:normal;font-size:12px;color:var(--text3)">${esc(tp2.basis||'')}</td>
          <td>${esc(tp2.method||'合格判定')}<div style="font-size:11px;color:var(--text3)">${esc(tp2.tool||'')}</div></td>
          <td><input type="text" data-i="${i}" class="cval" placeholder="${tp2.method==='实测值'?'填写实测数值':'结果描述'}" value="${esc(c.val)}" style="width:130px"></td>
          <td><div class="radio-line" style="padding:0">
            <label><input type="radio" name="ck${i}" data-i="${i}" data-ok="1" ${c.ok===true?'checked':''}>合格</label>
            <label><input type="radio" name="ck${i}" data-i="${i}" data-ok="0" ${c.ok===false?'checked':''}>不合格</label>
          </div></td>
          <td><div class="up-box" onclick="fakeUpload(${i})">${c.img?`<img src="${c.img}">`:'＋<br>上传'}</div></td>
        </tr>`}).join('')}</tbody></table></div>
      <div class="sec-t" style="margin-top:16px">整批判定 <span class="hint">先选判定口径，数量与结论自动带出，可再手工微调</span></div>
      <div class="quick-row">
        <button class="btn sm" style="border-color:#0fa868;color:#0fa868" onclick="quickJudge('ok')">✔ 整批合格</button>
        <button class="btn sm warn" onclick="quickJudge('part')">◐ 部分合格</button>
        <button class="btn sm danger-soft" onclick="quickJudge('no')">✖ 整批不合格</button>
      </div>
      <div class="sum-box">
        <div class="sum-item">合格数量<input type="number" id="fPass" min="0" max="${r.qty}" value="${r.pass}"></div>
        <div class="sum-item">不合格数量<input type="number" id="fFail" min="0" max="${r.qty}" value="${r.fail}"></div>
        <div class="sum-item">质检数量<b>${r.qty}</b></div>
        <div class="sum-item" style="margin-left:auto">质检结论<b id="fConcl" style="font-size:14px">${esc(r.concl)}</b></div>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:6px">合格数量 + 不合格数量 须等于质检数量</div>
      <div class="fg full" style="margin-top:12px"><label>质检备注</label><textarea id="fNote" placeholder="记录检验过程中的异常情况">${esc(q.note)}</textarea></div>
    </div>
    <div class="m-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn pri" onclick="saveFill('${qid}',${li})">保存修改</button></div>`);
    document.querySelectorAll('.cval').forEach(el=>el.addEventListener('input',e=>{checks[+e.target.dataset.i].val=e.target.value}));
    document.querySelectorAll('input[type=radio][data-ok]').forEach(el=>el.addEventListener('change',e=>{
      checks[+e.target.dataset.i].ok=e.target.dataset.ok==='1';
      autoSum();render2();
    }));
    $('#fPass').addEventListener('input',()=>sumManual());
    $('#fFail').addEventListener('input',()=>sumManual());
  }
  function sumManual(){
    const p=+$('#fPass').value||0,f=+$('#fFail').value||0;
    $('#fConcl').textContent=f===0?(p===r.qty?'已完成·合格':'已完成·部分合格'):(p===0?'已完成·不合格':'已完成·部分合格');
  }
  function autoSum(){
    const bad=checks.filter(c=>c.ok===false).length;
    if(bad===0){$('#fPass').value=r.qty;$('#fFail').value=0}
    else{$('#fFail').value=Math.min(r.qty,bad);$('#fPass').value=r.qty-Math.min(r.qty,bad)}
    sumManual();
  }
  window.fillAllOk=()=>{checks.forEach(c=>c.ok=true);render();autoSum();sumManual()};
  window.quickJudge=k=>{
    if(k==='ok'){checks.forEach(c=>c.ok=true);$('#fPass')&&($('#fPass').value=r.qty,$('#fFail').value=0)}
    if(k==='no'){checks.forEach(c=>{if(c.ok!==false)c.ok=c.ok===null?false:c.ok});const has=checks.some(c=>c.ok===false);if(!has)checks.forEach(c=>c.ok=false);}
    render();
    if(k==='ok'){$('#fPass').value=r.qty;$('#fFail').value=0;sumManual()}
    if(k==='no'){$('#fFail').value=r.qty;$('#fPass').value=0;sumManual()}
    if(k==='part')toast('请按检验项勾选不合格项，数量将自动带出','info');
  };
  window.fakeUpload=i=>{checks[i].img='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44"><rect width="44" height="44" rx="4" fill="#2f7bf6" opacity="0.15"/><path d="M8 30l8-9 6 6 5-5 9 8" stroke="#2f7bf6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="13" r="3" fill="#2f7bf6"/></svg>');render();toast('图片已上传','info')};
  window.saveFill=()=>{
    const p=+$('#fPass').value||0,f=+$('#fFail').value||0;
    if(p+f!==r.qty){toast('合格+不合格数量须等于质检数量（'+r.qty+'）','err');return}
    if(checks.some(c=>c.ok===null)){toast('还有检验项目未判定结论','err');return}
    r.pass=p;r.fail=f;
    r.concl=f===0?'已完成·合格':(p===0?'已完成·不合格':'已完成·部分合格');
    q.note=$('#fNote').value.trim();
    if(q.lines.every(l=>l.r.concl!=='待质检'))q.status='已完成';
    closeModal();
    const idx=modalStack.length; // 若详情弹窗仍在则刷新
    if(idx>0){const m=modalStack[idx-1];m.remove();modalStack.pop()}
    renderQc();
    if(f>0){autoNcr(q,line)}
    else toast('质检结果已保存');
  };
  render();
  function render2(){/* 保留结论刷新 */}
}
function autoNcr(q,line){
  const day=today().replace(/-/g,'');
  const seq=String(ncrList.filter(n=>n.id.includes(day)).length+1).padStart(3,'0');
  const id='NCR-'+day+'-'+seq;
  const bad=line.r.checks.filter(c=>c.ok===false).map(c=>c.name).join('、')||'数量不合格';
  ncrList.unshift({id,qc:q.id,code:line.code,obj:line.mat,way:'不合格通知 NCR',failQty:line.r.fail,failItem:bad,status:'待提交',
    src:{qc:q.id,obj:line.mat,code:line.code,failQty:line.r.fail,sug:line.r.fail>=line.r.qty?'退货':'让步放行'},recheck:'',submitter:q.user,reject:0});
  toast('存在不合格项，已自动生成处置单 '+id,'info');
  $('#msgDot').textContent=ncrList.filter(n=>n.status==='待提交').length;
  $('#msgDot').style.display='flex';
}

/* ==================== 不合格品页 ==================== */
const ncrFilter={kw:'',status:'',way:'',page:1,size:10};
function ncrFiltered(){
  return ncrList.filter(n=>{
    if(ncrFilter.status&&n.status!==ncrFilter.status)return false;
    if(ncrFilter.way&&n.way!==ncrFilter.way)return false;
    if(ncrFilter.kw){const k=ncrFilter.kw.toLowerCase();
      if(!(n.id+n.qc+n.code+n.obj+n.failItem).toLowerCase().includes(k))return false}
    return true;
  });
}
function renderNcr(){
  const rows=ncrFiltered(),tp=Math.max(1,Math.ceil(rows.length/ncrFilter.size));
  if(ncrFilter.page>tp)ncrFilter.page=tp;
  const pr=rows.slice((ncrFilter.page-1)*ncrFilter.size,ncrFilter.page*ncrFilter.size);
  const cnt=st=>ncrList.filter(n=>n.status===st).length;
  const card=(ic,cls,lab,num,sub,st)=>`<div class="stat ${ncrFilter.status===st&&st?'on':''}" onclick="ncrByStatus('${st}')">
      <div class="ic ${cls}">${ic}</div><div><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub}</div></div></div>`;
  $('#page').innerHTML=`
  <div class="stats">
    ${card(ICONS.box,'blue','全部处置单',ncrList.length,'由质检不合格自动生成','')}
    ${card(ICONS.fileEdit,'orange','待提交',cnt('待提交'),'需发起审批','待提交')}
    ${card(ICONS.refresh,'cyan','审批中',cnt('审批中'),'等待领导审批','审批中')}
    ${card(ICONS.check,'green','已通过',cnt('已通过'),'处置完成','已通过')}
    ${card(ICONS.ban,'red','已驳回',cnt('已驳回'),'需修改后重提','已驳回')}
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">不合格品处置清单</div>
      <div class="panel-tools"><span style="font-size:12px;color:var(--text3)">💡 质检结果存在不合格数量时，系统自动生成本单</span></div></div>

function ncrByStatus(st){ncrFilter.status=(st&&ncrFilter.status===st)?'':st;ncrFilter.page=1;renderNcr()}
function ncrSearch(){ncrFilter.kw=$('#ncrKw').value.trim();ncrFilter.status=$('#ncrStatus').value;ncrFilter.way=$('#ncrWay').value;ncrFilter.page=1;renderNcr()}
function ncrReset(){Object.assign(ncrFilter,{kw:'',status:'',way:'',page:1});renderNcr();toast('筛选条件已重置','info')}
function ncrPage(n){ncrFilter.page=n;renderNcr()}
function delNcr(id){if(!confirm('确认删除处置单 '+id+' ？'))return;ncrList=ncrList.filter(n=>n.id!==id);renderNcr();toast('处置单已删除')}
function ncrSubmit(id){const n=ncrList.find(x=>x.id===id);if(!n.way){toast('请先在编辑中确定最终处置方式','err');return}

/* ==================== 质检类型页 ==================== */
const typeFilter={kw:'',stage:'',status:'',page:1,size:10};
function typeFiltered(){
  return types.filter(t=>{
    if(typeFilter.stage&&t.stage!==typeFilter.stage)return false;
    if(typeFilter.status&&t.status!==typeFilter.status)return false;
    if(typeFilter.kw){const k=typeFilter.kw.toLowerCase();
      if(!(t.code+t.name+t.scope).toLowerCase().includes(k))return false}
    return true;
  });
}
function renderType(){
  const rows=typeFiltered(),tp=Math.max(1,Math.ceil(rows.length/typeFilter.size));
  if(typeFilter.page>tp)typeFilter.page=tp;
  const pr=rows.slice((typeFilter.page-1)*typeFilter.size,typeFilter.page*typeFilter.size);
  const usedType=new Set(qcList.flatMap(q=>q.lines.map(l=>l.type)));
  const card=(ic,cls,lab,num,sub,st)=>`<div class="stat ${typeFilter.status===st&&st?'on':''}" onclick="typeByStatus('${st}')">
      <div class="ic ${cls}">${ic}</div><div><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub}</div></div></div>`;
  $('#page').innerHTML=`
  <div class="stats">
    ${card(ICONS.layers,'blue','全部质检类型',types.length,'覆盖来料/内部/出厂','')}
    ${card(ICONS.check,'green','启用中',types.filter(t=>t.status==='启用').length,'可被质检单选用的类型','启用')}
    ${card(ICONS.ban,'gray','已停用',types.filter(t=>t.status==='停用').length,'停用后不可选用','停用')}
    ${card(ICONS.flask,'purple','检验项目总数',types.reduce((a,t)=>a+t.items.length,0),'关键项 '+types.reduce((a,t)=>a+t.items.filter(i=>i.key).length,0)+' 项','')}
    ${card(ICONS.link,'cyan','已被引用',types.filter(t=>usedType.has(t.name)).length,'存在质检单使用其类型','')}
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">质检类型清单</div>
      <div class="panel-tools"><button class="btn pri" onclick="openTypeEdit()">＋ 新增质检类型</button></div></div>
    <div class="filters">
      <div class="f-item"><label>类型编号</label><div class="f-ctl"><input type="text" id="tKw" placeholder="编号 / 名称 / 适用范围" value="${esc(typeFilter.kw)}" onkeydown="if(event.key==='Enter')typeSearch()"></div></div>
      <div class="f-item"><label>适用阶段</label><div class="f-ctl"><select id="tStage"><option value="">全部阶段</option>${stages.map(s=>`<option ${typeFilter.stage==s?'selected':''}>${s}</option>`).join('')}</select></div></div>
      <div class="f-item"><label>状态</label><div class="f-ctl"><select id="tStatus"><option value="">全部状态</option>${['启用','停用'].map(s=>`<option ${typeFilter.status==s?'selected':''}>${s}</option>`).join('')}</select></div></div>
    </div>
    <div class="f-more" style="padding-left:0;margin-left:auto">
      <button class="btn pri" onclick="typeSearch()">查 找</button>
      <button class="btn" onclick="typeReset()">重 置</button>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>类型编号</th><th>质检类型</th><th>适用阶段</th><th>检验项目数</th><th>状态</th><th>适用范围说明</th><th style="min-width:200px">操作</th></tr></thead>
      <tbody>${pr.length?pr.map(t=>`<tr>
        <td class="mono num-strong">${t.code}</td>
        <td class="num-strong">${esc(t.name)}</td>
        <td>${tag(t.stage,stageColor[t.stage]||'gray')}</td>
        <td><span class="mini-tag t-blue" style="border-radius:10px;padding:2px 8px">${t.items.length} 项</span>${t.items.some(i=>i.key)?`<span class="badge-key" style="margin-left:5px">含关键项</span>`:''}</td>
        <td>${tag(t.status,statusColor[t.status])}</td>
        <td style="max-width:300px;white-space:normal;font-size:12px;color:var(--text3)">${esc(t.scope)}</td>
        <td><div class="ops">
          <button class="btn sm pri" onclick="openItems('${t.code}')">检验项目</button>
          <button class="btn sm warn" onclick="openTypeEdit('${t.code}')">编辑</button>
          <button class="btn sm danger-soft" onclick="delType('${t.code}')">删除</button>
        </div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><div class="e-ic">🗔</div>没有符合条件的质检类型</div></td></tr>`}
      </tbody></table></div>
    ${pager(rows.length,typeFilter.page,typeFilter.size,'typePage')}
  </div>`;
}
function typeByStatus(st){typeFilter.status=(st&&typeFilter.status===st)?'':st;typeFilter.page=1;renderType()}
function typeSearch(){typeFilter.kw=$('#tKw').value.trim();typeFilter.stage=$('#tStage').value;typeFilter.status=$('#tStatus').value;typeFilter.page=1;renderType()}
function typeReset(){Object.assign(typeFilter,{kw:'',stage:'',status:'',page:1});renderType();toast('筛选条件已重置','info')}
function typePage(n){typeFilter.page=n;renderType()}
function delType(code){const t=types.find(x=>x.code===code);
  if(qcList.some(q=>q.lines.some(l=>l.type===t.name))){toast('该类型已被质检单引用，不可删除，可改为停用','err');return}
  if(!confirm('确认删除质检类型「'+t.name+'」？'))return;
  types=types.filter(x=>x.code!==code);renderType();toast('质检类型已删除')}
function openTypeEdit(code){
  const t=code?types.find(x=>x.code===code):null;
  openModal(`
  <div class="m-head"><div class="m-title">${t?'✏️ 编辑质检类型':'＋ 新增质检类型'}</div><button class="m-close" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <div class="form-grid">
      <div class="fg"><label><span class="req">*</span>类型编号</label><input type="text" id="teCode" value="${esc(t?t.code:'SC8.6.1-JL0'+(types.length+1))}" ${t?'disabled':''}></div>
      <div class="fg"><label><span class="req">*</span>质检类型名称</label><input type="text" id="teName" value="${esc(t?t.name:'')}" placeholder="如：五金结构件到货普检"></div>
      <div class="fg"><label>适用阶段</label><select id="teStage">${stages.map(s=>`<option ${t&&t.stage==s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="fg"><label>状态</label><select id="teStatus">${['启用','停用'].map(s=>`<option ${t&&t.status==s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="fg full"><label>适用范围说明</label><textarea id="teScope" placeholder="描述该类型适用的物料/场景">${esc(t?t.scope:'')}</textarea></div>
    </div>
    ${t?'':'<div style="font-size:12px;color:var(--text3);margin-top:8px">💡 新增后请通过「检验项目」为该类型绑定检验项，建单时方可选用</div>'}
  </div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn pri" onclick="saveType('${code||''}')">确 定</button></div>`);
}
window.saveType=code=>{
  const c=$('#teCode').value.trim(),n=$('#teName').value.trim();
  if(!c||!n){toast('类型编号与名称必填','err');return}
  if(code){const t=types.find(x=>x.code===code);t.name=n;t.stage=$('#teStage').value;t.status=$('#teStatus').value;t.scope=$('#teScope').value.trim();
    toast('质检类型已更新')}
  else{
    if(types.some(x=>x.code===c)){toast('类型编号已存在','err');return}
    types.push({code:c,name:n,stage:$('#teStage').value,status:$('#teStatus').value,scope:$('#teScope').value.trim(),items:[]});
    toast('质检类型已新增，请继续维护检验项目')}
  closeModal();renderType();
};

      <span style="margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--text3);font-size:12px">序号<input type="number" id="ieNo" value="${i?i.no:t.items.length}" style="width:64px"></span></div></div>
  </div>
  <div style="font-size:12px;color:var(--text3);margin-top:8px">💡 关键项不合格时，整批默认判为不合格，需走让步接收审批</div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn pri" onclick="saveItem('${code}',${ix})">确 定</button></div>`);
}
window.saveItem=(code,ix)=>{
  const t=types.find(x=>x.code===code);
  const name=$('#ieName').value.trim();if(!name){toast('质检项目必填','err');return}
  const obj={no:+$('#ieNo').value||0,name,basis:$('#ieBasis').value.trim(),
    method:$('#ieMethod').value.startsWith('实测值')?'实测值':'合格判定',
    tool:$('#ieTool').value.trim()||'目测',
    key:document.querySelector('input[name=ieKey]:checked').value==='1'};
  if(ix>=0){t.items[ix]=obj;toast('检验项目已更新')}else{t.items.push(obj);toast('检验项目已新增')}
  closeModal();openItems(code);renderType();
};
window.delItem=(code,ix)=>{const t=types.find(x=>x.code===code);
  if(!confirm('确认删除检验项目「'+t.items[ix].name+'」？'))return;
  t.items.splice(ix,1);openItems(code);renderType();toast('检验项目已删除')};

/* ==================== 启动 ==================== */
$('#miQc').innerHTML=ICONS.clipboard;$('#miNcr').innerHTML=ICONS.alert;$('#miType').innerHTML=ICONS.layers;
document.querySelectorAll('.mi svg').forEach(s=>{s.style.width='16px';s.style.height='16px';s.style.verticalAlign='-3px'});
go('qc');
</script>
</body>
</html>
